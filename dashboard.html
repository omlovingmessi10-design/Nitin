      const [currentUser, setCurrentUser] = useState(null);

      // Main Navigation State: 
      // 'hub': Subject Overview Landing
      // 'topics': Testbook-Style Topic Breakdown for active subject
      // 'quiz': Practice Workspace & Test Engine

      // App Hierarchy States
      const [exam] = useState("SSC Practice");
      const [activeSubjectId, setActiveSubjectId] = useState("quant");

      const [questions, setQuestions] = useState([]);

      const [selectedAnswers, setSelectedAnswers] = useState({});
      const [markedForReview, setMarkedForReview] = useState(new Set());
      const [loading, setLoading] = useState(false);
      const [submitted, setSubmitted] = useState(false);
      const [showReportCard, setShowReportCard] = useState(false);
      const [showSubmitConfirmModal, setShowSubmitConfirmModal] = useState(false);
      const [latestTestReport, setLatestTestReport] = useState(null);

      // Dynamically compute Level boundaries for any questions set (25, 40, or 42 Qs)
      const levelRanges = React.useMemo(() => {
        if (!questions || questions.length === 0) return [];
        const levels = [1, 2, 3, 4, 5];
        return levels.map(lvlNum => {
          const indices = [];
          questions.forEach((q, idx) => {
            const qLvl = (q.level_group || q.level || '');
            if (qLvl.toLowerCase().includes(`level ${lvlNum}`)) {
              indices.push(idx);
            }
          });
          if (indices.length > 0) {
            return {
              level: lvlNum,
              startIdx: indices[0],
              endIdx: indices[indices.length - 1] + 1,
              count: indices.length
            };
          }
          const qPerLvl = questions.length === 25 ? 5 : Math.ceil(questions.length / 5);
          const start = (lvlNum - 1) * qPerLvl;
          const end = Math.min(lvlNum * qPerLvl, questions.length);
          return {
            level: lvlNum,
            startIdx: start,
            endIdx: end,
            count: Math.max(0, end - start)
          };
        });
      }, [questions]);

      // 10-Star Rating & Feedback States
      const [feedbacks, setFeedbacks] = useState({});

      // Per-Question Stopwatch Timer effect (counts elapsed seconds spent on current question)
      useEffect(() => {
        if (viewMode !== "quiz" || submitted || activeLevelMilestone) return;

        const interval = setInterval(() => {
          setCurrentQuestionTime(prev => {
            const nextVal = prev + 1;
            setQuestionTimes(qt => ({ ...qt, [currentIndex]: nextVal }));
            return nextVal;
          });
        }, 1000);

        return () => clearInterval(interval);
      }, [viewMode, submitted, currentIndex, activeLevelMilestone]);

      // When currentIndex changes, load that question's accumulated time
      useEffect(() => {
        if (viewMode === "quiz") {
          setCurrentQuestionTime(questionTimes[currentIndex] || 0);

      // Carousel Ref for Question Number Strip

      // --- 4. AUTH STATUS CHECK ---
      useEffect(() => {

          try {
            const { data: { session } } = await supabase.auth.getSession();

          } catch (e) {

            setAuthLoading(false);
          }

        checkSession();

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setCurrentUser(session?.user || null);
        });

        return () => subscription.unsubscribe();
      }, []);

      const handleSignOut = async () => {

          console.error("Sign out error:", e);

      // --- 5. SWITCH SUBJECT HANDLER ---
      const handleSelectSubject = (subjectId) => {

      // --- 6. LAUNCH QUIZ FOR TOPIC & SET ---
      const handleStartTopicQuiz = (topicObj, setNumber = "Practice 1") => {
        setSelectedTopicObj(topicObj);

        setViewMode("quiz");
      };

      // --- 7. FETCH QUESTIONS ACCORDING TO ACTIVE SUBJECT & TOPIC ---
      useEffect(() => {
        if (viewMode !== "quiz") return;

        async function loadQuestions() {
          setLoading(true);
          try {
            if (activeSubjectId === "quant" && selectedTopicObj.isLiveDatabase) {
              // Fetch Quant Time & Work questions from Supabase table
              const { data, error } = await supabase
                .from('time_and_work_questions')
                .select('*')
                .eq('practice_set', practiceSet)
                .order('question_number', { ascending: true });

              if (error || !data || data.length === 0) {
                console.warn("Supabase fetch returned empty, using curated questions.");
                const fallback = getTopicQuestions(activeSubjectId, selectedTopicObj, practiceSet);
                setQuestions(fallback);
              } else {
                setQuestions(data);
              }
            } else {
              // Load curated questions for the selected topic
              const dataset = getTopicQuestions(activeSubjectId, selectedTopicObj, practiceSet);
              setQuestions(dataset);
            }

            // Reset quiz states for fresh set
            setSelectedAnswers({});
            setMarkedForReview(new Set());
            setFeedbacks({});
            setCurrentIndex(0);
            setSubmitted(false);
            setShowReportCard(false);
            setShowSubmitConfirmModal(false);
            setLatestTestReport(null);
            setTimeLeft(35 * 60);
            setQuestionTimes({});
            setCurrentQuestionTime(0);
            setShownMilestoneLevels(new Set());
            setActiveLevelMilestone(null);

            // Pre-load user's existing 1-10 star ratings from Supabase question_ratings
            try {
              supabase
                .from('question_ratings')
                .select('question_number, stars_rating')
                .eq('user_name', activeUserName)
                .eq('chapter_id', selectedTopicObj.id)
                .eq('practice_set', practiceSet)
                .then(({ data: rData }) => {
                  if (rData && rData.length > 0) {
                    const rMap = {};
                    rData.forEach(item => {
                      rMap[item.question_number] = item.stars_rating;
                    });
                    setFeedbacks(rMap);
                  }
                });
            } catch (_) {}
          } catch (err) {
            console.error("Fetch error:", err.message);
          } finally {
            setLoading(false);
          }
        }

        loadQuestions();
      }, [activeSubjectId, selectedTopicObj, practiceSet, viewMode]);

      // --- 8. COUNTDOWN TIMER ---
      useEffect(() => {
        if (viewMode !== "quiz" || submitted) return;
        const timer = setInterval(() => {
          setTimeLeft(prev => {
            if (prev <= 1) {
              clearInterval(timer);
              handleTestSubmit();
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [viewMode, submitted, selectedAnswers, questions]);

      const formatTime = (seconds) => {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      };

      // --- 9. QUIZ INTERACTIONS & LEVEL COMPLETION CHECK ---
      const handleOptionSelect = (optionKey) => {
        if (submitted) return;
        const newAnswers = { ...selectedAnswers, [currentIndex]: optionKey };
        setSelectedAnswers(newAnswers);

        // Instantly save question response to Supabase
        saveQuestionResponseToSupabase(questions[currentIndex], optionKey, currentIndex, markedForReview.has(currentIndex));

        // Level-wise Milestone Calculation dynamically matching level boundaries
        const curRange = levelRanges.find(r => currentIndex >= r.startIdx && currentIndex < r.endIdx) || {
          level: 1,
          startIdx: 0,
          endIdx: questions.length,
          count: questions.length
        };
        const currentLevel = curRange.level;
        const levelStart = curRange.startIdx;
        const levelEnd = curRange.endIdx;

        // Check if all 8 questions in this level have been answered
        let levelAllAnswered = true;
        for (let idx = levelStart; idx < levelEnd; idx++) {
          if (newAnswers[idx] === undefined || newAnswers[idx] === null) {
            levelAllAnswered = false;
            break;
          }
        }

        if (levelAllAnswered && !shownMilestoneLevels.has(currentLevel)) {
          const levelQs = questions.slice(levelStart, levelEnd);
          let correctCount = 0;
          const wrongList = [];

          levelQs.forEach((q, i) => {
            const actualIdx = levelStart + i;
            const userChoice = newAnswers[actualIdx];
            const isCorrect = (userChoice || '').toLowerCase() === (q.correct_option || '').toLowerCase();
            if (isCorrect) {
              correctCount++;
            } else {
              wrongList.push({
                qNum: q.question_number || (actualIdx + 1),
                text: q.question_text || '',
                text_hi: q.question_text_hi || '',
                chosen: userChoice,
                correct_option: q.correct_option,
                type_category: q.type_category || `Level ${currentLevel}`,
                level: q.level || `Level ${currentLevel}`
              });
            }
          });

          const weakTypes = Array.from(new Set(wrongList.map(item => item.type_category)));
          const totalInLevel = levelQs.length;
          const accuracy = Math.round((correctCount / totalInLevel) * 100);
          const score = (correctCount * 2) - (wrongList.length * 0.5);

          const milestoneData = {
            level: currentLevel,
            levelTitle: questions[levelStart]?.level_group || `Level ${currentLevel}`,
            total: totalInLevel,
            correct: correctCount,
            wrong: wrongList.length,
            accuracy: accuracy,
            score: score,
            wrongQuestions: wrongList,
            weakTypes: weakTypes,
            nextLevel: (currentLevel < 5 && levelEnd < questions.length) ? currentLevel + 1 : null
          };

          // Mark this level milestone as triggered
          setShownMilestoneLevels(prev => new Set(prev).add(currentLevel));
          setActiveLevelMilestone(milestoneData);

          // Save weak questions & category diagnosis to ANALYST tool / performance records
          if (weakTypes.length > 0) {
            const levelRecord = {
              id: 'milestone_' + currentLevel + '_' + Date.now(),
              timestamp: Date.now(),
              dateStr: `Level ${currentLevel} Milestone (` + new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }) + ')',
              subjectId: activeSubjectId,
              subjectName: currentSubject.shortName,
              topicId: selectedTopicObj.id,
              topicTitle: `${selectedTopicObj.title} (Level ${currentLevel})`,
              practiceSet: practiceSet,
              totalQuestions: totalInLevel,
              attemptedCount: totalInLevel,
              correctCount: correctCount,
              incorrectCount: wrongList.length,
              unattemptedCount: 0,
              score: score,
              accuracy: accuracy,
              weakCategories: weakTypes,
              questions: levelQs.map((q, i) => ({
                qNum: q.question_number || (levelStart + i + 1),
                topicId: selectedTopicObj.id,
                topicTitle: selectedTopicObj.title,
                subjectId: activeSubjectId,
                typeCategory: q.type_category || `Level ${currentLevel}`,
                level: q.level || `Level ${currentLevel}`,
                isAttempted: true,
                isCorrect: (newAnswers[levelStart + i] || '').toLowerCase() === (q.correct_option || '').toLowerCase()
              }))
            };

            setPerformanceRecords(prev => {
              const updated = [levelRecord, ...prev];
              try {
                localStorage.setItem('ssc_user_performance_records_v1', JSON.stringify(updated));
              } catch (e) { }
              return updated;
            });
          }
        }
      };

      const handleReachNextLevel = (nextLvl) => {
        setActiveLevelMilestone(null);
        if (nextLvl && levelRanges[nextLvl - 1]) {
          const nextIdx = levelRanges[nextLvl - 1].startIdx;
          if (nextIdx < questions.length) {
            setCurrentIndex(nextIdx);
          }
        }
      };

      const toggleReview = () => {
        const updated = new Set(markedForReview);
        if (updated.has(currentIndex)) updated.delete(currentIndex);
        else updated.add(currentIndex);
        setMarkedForReview(updated);
      };

      // --- 9.1 INSTANT QUESTION RESPONSE LOGGING TO SUPABASE ---
      const saveQuestionResponseToSupabase = async (qObj, chosenOpt, qIndex, isReview = false) => {
        if (!qObj) return;
        const isCorrect = (chosenOpt || '').toLowerCase() === (qObj.correct_option || '').toLowerCase();
        const timeSpent = questionTimes[qIndex] || currentQuestionTime || 0;
        const qNum = qObj.question_number || (qIndex + 1);

        const payload = {
          user_name: activeUserName,
          subject: activeSubjectId,
          chapter_id: selectedTopicObj.id,
          chapter_title: selectedTopicObj.title,
          practice_set: practiceSet,
          question_number: qNum,
          level: qObj.level || (qObj.level_group || 'Moderate'),
          type_code: qObj.type_code || (qObj.type || ''),
          type_category: qObj.type_category || '',
          selected_option: chosenOpt,
          correct_option: qObj.correct_option,
          is_correct: isCorrect,
          time_spent_seconds: timeSpent,
          is_marked_review: !!isReview,
          attempted_at: new Date().toISOString()
        };

        try {
          // 1. Insert into master responses table
          await supabase.from('user_question_responses').insert([payload]);

          // 2. Direct insert to chapter specific table
          const chapId = (selectedTopicObj.id || '').toLowerCase();
          const chapTitle = (selectedTopicObj.title || '').toLowerCase();
          const chapterPayload = {
            user_name: activeUserName,
            practice_set: practiceSet,
            question_number: qNum,
            level: payload.level,
            type_code: payload.type_code,
            type_category: payload.type_category,
            selected_option: chosenOpt,
            correct_option: qObj.correct_option,
            is_correct: isCorrect,
            time_spent_seconds: timeSpent,
            is_marked_review: !!isReview,
            attempted_at: payload.attempted_at
          };

          if (chapId.includes('ratio') || chapTitle.includes('ratio')) {
            await supabase.from('ratio_chapter_responses').insert([chapterPayload]);
          } else if (chapId.includes('avg') || chapTitle.includes('average')) {
            await supabase.from('average_chapter_responses').insert([chapterPayload]);
          } else if (chapId.includes('percent') || chapTitle.includes('percentage')) {
            await supabase.from('percentage_chapter_responses').insert([chapterPayload]);
          } else if (chapId.includes('time') || chapId.includes('work') || chapTitle.includes('work')) {
            await supabase.from('time_work_chapter_responses').insert([chapterPayload]);
          }
        } catch (dbErr) {
          console.warn("Supabase live response tracking error:", dbErr.message);
        }
      };

      // --- 10. SUBMIT 10-STAR RATING & FEEDBACK TO SUPABASE ---
      const handleFeedbackSubmit = async (stars, optionalComment = "") => {
        const currentQNum = questions[currentIndex]?.question_number || (currentIndex + 1);
        if (!currentQNum) return;

        const starVal = Number(stars);
        setFeedbacks(prev => ({ ...prev, [currentQNum]: starVal }));
        setFeedbackStatus("saving");

        const ratingLabel = RATING_LABELS[starVal] || `${starVal}/10 Stars`;

        try {
          // 1. Save / Upsert to dedicated `question_ratings` table in Supabase
          const { error } = await supabase
            .from('question_ratings')
            .upsert({
              user_name: activeUserName,
              subject: activeSubjectId,
              chapter_id: selectedTopicObj.id,
              chapter_title: selectedTopicObj.title,
              practice_set: practiceSet,
              question_number: currentQNum,
              stars_rating: starVal,
              rating_label: ratingLabel,
              feedback_comment: optionalComment || null,
              rated_at: new Date().toISOString()
            }, { onConflict: 'user_name,chapter_id,practice_set,question_number' });

          if (error) {
            console.warn("Supabase question_ratings warning:", error.message);
          }

          // 2. Legacy table fallback
          try {
            await supabase
              .from('question_feedback')
              .insert([{
                practice_set: `${currentSubject.shortName} - ${selectedTopicObj.title} - ${practiceSet}`,
                question_number: currentQNum,
                rating: `${starVal}/10 Stars (${ratingLabel})`
              }]);
          } catch (_) {}

          setFeedbackStatus("saved");
          setTimeout(() => setFeedbackStatus(null), 2500);
        } catch (err) {
          console.error("Error saving feedback:", err.message);
          setFeedbackStatus("error");
          setTimeout(() => setFeedbackStatus(null), 3000);
        }
      };

      // --- 11. SCORING & TEST SUBMISSION RECORDING ---
      const scoreData = useMemo(() => {
        let correct = 0, incorrect = 0, unattempted = 0;
        questions.forEach((q, idx) => {
          const ans = selectedAnswers[idx];
          if (!ans) unattempted++;
          else if (ans === q.correct_option) correct++;
          else incorrect++;
        });
        const totalScore = (correct * 2) - (incorrect * 0.5); // Standard SSC Tier 1 Marking
        return { correct, incorrect, unattempted, totalScore };
      }, [submitted, selectedAnswers, questions]);

      const promptTestSubmit = () => {
        if (submitted) {
          setShowReportCard(true);
          return;
        }
        const attemptedCount = Object.keys(selectedAnswers).length;
        if (attemptedCount < questions.length) {
          setShowSubmitConfirmModal(true);
        } else {
          handleTestSubmit();
        }
      };

      const handleReattemptTest = () => {
        setSelectedAnswers({});
        setMarkedForReview(new Set());
        setSubmitted(false);
        setShowReportCard(false);
        setShowSubmitConfirmModal(false);
        setLatestTestReport(null);
        setCurrentIndex(0);
        setTimeLeft(35 * 60);
        setQuestionTimes({});
        setCurrentQuestionTime(0);
      };

      const handleReviewSolutions = (targetIdx = 0) => {
        setShowReportCard(false);
        setShowSubmitConfirmModal(false);
        setCurrentIndex(targetIdx);
      };

      const handleTestSubmit = () => {
        if (submitted) {
          setShowReportCard(true);
          return;
        }
        setSubmitted(true);

        // Record test metrics for analytics & weak areas diagnosis
        let correct = 0, incorrect = 0, unattempted = 0;
        const questionDetails = questions.map((q, idx) => {
          const userAns = selectedAnswers[idx];
          const isAttempted = userAns !== undefined && userAns !== null;
          const isCorrect = isAttempted && String(userAns).toLowerCase() === String(q.correct_option || '').toLowerCase();
          if (!isAttempted) unattempted++;
          else if (isCorrect) correct++;
          else incorrect++;

          return {
            qNum: q.question_number || (idx + 1),
            topicId: selectedTopicObj.id,
            topicTitle: selectedTopicObj.title,
            subjectId: activeSubjectId,
            typeCategory: q.type_category || selectedTopicObj.title,
            level: q.level || "Moderate",
            isAttempted,
            isCorrect
          };
        });

        const attempted = correct + incorrect;
        const score = (correct * 2) - (incorrect * 0.5);
        const totalMaxScore = questions.length * 2;
        const accuracy = attempted > 0 ? Math.round((correct / attempted) * 100) : 0;

        const timeTakenSeconds = Math.max(0, (35 * 60) - timeLeft);
        const timeTakenMins = Math.floor(timeTakenSeconds / 60);
        const timeTakenSecs = timeTakenSeconds % 60;
        const timeTakenFormatted = `${timeTakenMins}m ${String(timeTakenSecs).padStart(2, '0')}s`;
        const avgTimePerQuestion = attempted > 0 ? Math.round(timeTakenSeconds / attempted) : 0;

        // Realistic Percentile & Rank Estimation
        const scoreRatio = Math.max(0, score) / (totalMaxScore || 1);
        const accuracyRatio = accuracy / 100;
        const performanceFactor = (accuracyRatio * 0.6) + (scoreRatio * 0.4);
        const percentile = Math.min(99.8, Math.max(15.0, Math.round((performanceFactor * 84 + 15.5) * 10) / 10));
        const totalSimulatedAspirants = 4850;
        const rank = Math.max(1, Math.round(totalSimulatedAspirants * (1 - (percentile / 100))));

        // Level-wise breakdown (Levels 1 to 5)
        const levels = [1, 2, 3, 4, 5];
        const levelNames = {
          1: "Level 1: Moderate",
          2: "Level 2: More Than Moderate",
          3: "Level 3: Inspired from PYQs",
          4: "Level 4: PYQ+",
          5: "Level 5: PYQ++"
        };
        const levelBreakdown = levels.map(lvl => {
          const lvlQuestions = [];
          questions.forEach((q, idx) => {
            const qLvl = (q.level_group || q.level || '').toLowerCase();
            if (qLvl.includes(`level ${lvl}`)) {
              lvlQuestions.push({ q, idx });
            }
          });
          const totalInLvl = lvlQuestions.length;
          let lvlCorrect = 0, lvlIncorrect = 0, lvlUnattempted = 0;
          lvlQuestions.forEach(({ q, idx }) => {
            const ans = selectedAnswers[idx];
            if (ans === undefined || ans === null) lvlUnattempted++;
            else if (String(ans).toLowerCase() === String(q.correct_option || '').toLowerCase()) lvlCorrect++;
            else lvlIncorrect++;
          });
          const lvlAttempted = lvlCorrect + lvlIncorrect;
          const lvlAccuracy = lvlAttempted > 0 ? Math.round((lvlCorrect / lvlAttempted) * 100) : 0;
          const lvlScore = (lvlCorrect * 2) - (lvlIncorrect * 0.5);

          return {
            level: lvl,
            name: levelNames[lvl] || `Level ${lvl}`,
            total: totalInLvl,
            attempted: lvlAttempted,
            correct: lvlCorrect,
            incorrect: lvlIncorrect,
            unattempted: lvlUnattempted,
            accuracy: lvlAccuracy,
            score: lvlScore
          };
        }).filter(l => l.total > 0);

        // Pattern / Type Breakdown from PDF [Type - X]
        const typeMap = {};
        questions.forEach((q, idx) => {
          const typeCode = q.type_code || `Type ${((idx % 5) + 1)}`;
          const typeCat = q.type_category || typeCode;
          if (!typeMap[typeCode]) {
            typeMap[typeCode] = {
              typeCode,
              typeCategory: typeCat,
              typeCategoryHi: q.type_category_hi || "",
              total: 0,
              correct: 0,
              incorrect: 0,
              unattempted: 0
            };
          }
          typeMap[typeCode].total++;
          const ans = selectedAnswers[idx];
          if (ans === undefined || ans === null) {
            typeMap[typeCode].unattempted++;
          } else if (String(ans).toLowerCase() === String(q.correct_option || '').toLowerCase()) {
            typeMap[typeCode].correct++;
          } else {
            typeMap[typeCode].incorrect++;
          }
        });
        const typeBreakdown = Object.values(typeMap).map(t => {
          const att = t.correct + t.incorrect;
          return {
            ...t,
            attempted: att,
            accuracy: att > 0 ? Math.round((t.correct / att) * 100) : 0
          };
        });

        // Question Matrix for Interactive Palette
        const questionMatrix = questions.map((q, idx) => {
          const ans = selectedAnswers[idx];
          const isAttempted = ans !== undefined && ans !== null;
          const isCorrect = isAttempted && String(ans).toLowerCase() === String(q.correct_option || '').toLowerCase();
          const isWrong = isAttempted && !isCorrect;
          return {
            idx,
            qNum: q.question_number || (idx + 1),
            typeCode: q.type_code || '',
            level: q.level_group || q.level || '',
            userAns: ans ? String(ans).toUpperCase() : null,
            correctAns: String(q.correct_option || '').toUpperCase(),
            isAttempted,
            isCorrect,
            isWrong,
            isReview: markedForReview.has(idx)
          };
        });

        const report = {
          topicTitle: selectedTopicObj.title,
          topicTitleHi: selectedTopicObj.titleHi,
          subjectName: currentSubject.name,
          practiceSet: practiceSet,
          totalQuestions: questions.length,
          totalMaxScore: totalMaxScore,
          attemptedCount: attempted,
          correctCount: correct,
          incorrectCount: incorrect,
          unattemptedCount: unattempted,
          score: score,
          accuracy: accuracy,
          timeTakenFormatted,
          avgTimePerQuestion,
          percentile,
          rank,
          totalSimulatedAspirants,
          levelBreakdown,
          typeBreakdown,
          questionMatrix
        };

        setLatestTestReport(report);
        setShowReportCard(true);

        const newRecord = {
          id: 'test_' + Date.now(),
          timestamp: Date.now(),
          dateStr: 'Just now (' + new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }) + ')',
          subjectId: activeSubjectId,
          subjectName: currentSubject.shortName,
          topicId: selectedTopicObj.id,
          topicTitle: selectedTopicObj.title,
          practiceSet: practiceSet,
          totalQuestions: questions.length,
          attemptedCount: attempted,
          correctCount: correct,
          incorrectCount: incorrect,
          unattemptedCount: unattempted,
          score: score,
          accuracy: accuracy,
          questions: questionDetails
        };

        setPerformanceRecords(prev => {
          const updated = [newRecord, ...prev];
          try {
            localStorage.setItem('ssc_user_performance_records_v1', JSON.stringify(updated));
          } catch (e) {
            console.warn("Storage error:", e);
          }
          return updated;
        });

        // --- 11.1 SYNC COMPLETE TEST SCORECARD & ALL QUESTION RESPONSES TO SUPABASE ---
        try {
          supabase.from('test_submissions').insert([{
            user_name: activeUserName,
            subject: activeSubjectId,
            chapter_id: selectedTopicObj.id,
            chapter_title: selectedTopicObj.title,
            practice_set: practiceSet,
            total_questions: questions.length,
            attempted: attempted,
            correct: correct,
            incorrect: incorrect,
            unattempted: unattempted,
            score: score,
            accuracy_percent: accuracy,
            percentile: percentile,
            rank: rank,
            time_taken_seconds: timeTakenSeconds,
            breakdown_by_level: levelBreakdown,
            breakdown_by_type: typeBreakdown,
            submitted_at: new Date().toISOString()
          }]).then(({ error }) => {
            if (error) console.warn("test_submissions sync note:", error.message);
          });
        } catch (subErr) {
          console.warn("Test submission sync error:", subErr);
        }

        try {
          const finalBatch = questions.map((q, idx) => {
            const userAns = selectedAnswers[idx] || null;
            const isCorr = userAns ? String(userAns).toLowerCase() === String(q.correct_option || '').toLowerCase() : false;
            return {
              user_name: activeUserName,
              subject: activeSubjectId,
              chapter_id: selectedTopicObj.id,
              chapter_title: selectedTopicObj.title,
              practice_set: practiceSet,
              question_number: q.question_number || (idx + 1),
              level: q.level || (q.level_group || 'Moderate'),
              type_code: q.type_code || (q.type || ''),
              type_category: q.type_category || '',
              selected_option: userAns,
              correct_option: q.correct_option,
              is_correct: isCorr,
              time_spent_seconds: questionTimes[idx] || 0,
              is_marked_review: markedForReview.has(idx),
              attempted_at: new Date().toISOString()
            };
          });

          // Insert into master log
          supabase.from('user_question_responses').insert(finalBatch).then(() => {});

          // Insert into specific chapter table
          const chapId = (selectedTopicObj.id || '').toLowerCase();
          const chapTitle = (selectedTopicObj.title || '').toLowerCase();
          const chapterBatch = finalBatch.map(r => ({
            user_name: r.user_name,
            practice_set: r.practice_set,
            question_number: r.question_number,
            level: r.level,
            type_code: r.type_code,
            type_category: r.type_category,
            selected_option: r.selected_option,
            correct_option: r.correct_option,
            is_correct: r.is_correct,
            time_spent_seconds: r.time_spent_seconds,
            is_marked_review: r.is_marked_review,
            attempted_at: r.attempted_at
          }));

          if (chapId.includes('ratio') || chapTitle.includes('ratio')) {
            supabase.from('ratio_chapter_responses').insert(chapterBatch).then(() => {});
          } else if (chapId.includes('avg') || chapTitle.includes('average')) {
            supabase.from('average_chapter_responses').insert(chapterBatch).then(() => {});
          } else if (chapId.includes('percent') || chapTitle.includes('percentage')) {
            supabase.from('percentage_chapter_responses').insert(chapterBatch).then(() => {});
          } else if (chapId.includes('time') || chapId.includes('work') || chapTitle.includes('work')) {
            supabase.from('time_work_chapter_responses').insert(chapterBatch).then(() => {});
          }
        } catch (batchErr) {
          console.warn("Batch responses sync error:", batchErr);
        }
      };

      const handleResetAnalytics = () => {
        if (window.confirm("Are you sure you want to reset all practice analytics and history?")) {
          setPerformanceRecords([]);
          try {
            localStorage.removeItem('ssc_user_performance_records_v1');
          } catch (e) { }
        }
      };

      const handleLoadSampleData = () => {
        setPerformanceRecords(DEFAULT_PERFORMANCE_RECORDS);
        try {
          localStorage.setItem('ssc_user_performance_records_v1', JSON.stringify(DEFAULT_PERFORMANCE_RECORDS));
        } catch (e) { }
      };

      const handleLaunchWeakTopicPractice = (subjectId, topicId) => {
        const subj = SYLLABUS_DATA[subjectId] || SYLLABUS_DATA.quant;
        const targetTopic = subj.topics.find(t => t.id === topicId) || subj.topics[0];
        setActiveSubjectId(subjectId);
        setSelectedTopicObj(targetTopic);
        setPracticeSet("Practice 1");
        setViewMode("quiz");
        setShowAnalyticsModal(false);
      };

      // --- 12. COMPREHENSIVE PERFORMANCE & WEAK TYPES AGGREGATOR ---
      const analyticsData = useMemo(() => {
        const records = performanceRecords;
        const filtered = analyticsSubjectFilter === "all"
          ? records
          : records.filter(r => r.subjectId === analyticsSubjectFilter);

        let totalQuestions = 0;
        let totalAttempted = 0;
        let totalCorrect = 0;
        let totalIncorrect = 0;
        let totalScore = 0;

        filtered.forEach(r => {
          totalQuestions += r.totalQuestions || 0;
          totalAttempted += r.attemptedCount || 0;
          totalCorrect += r.correctCount || 0;
          totalIncorrect += r.incorrectCount || 0;
          totalScore += r.score || 0;
        });

        const accuracy = totalAttempted > 0 ? Math.round((totalCorrect / totalAttempted) * 100) : 0;

        // Group by Topic and Sub-Question Types
        const topicMap = {};
        filtered.forEach(r => {
          const tId = r.topicId;
          if (!topicMap[tId]) {
            topicMap[tId] = {
              topicId: r.topicId,
              topicTitle: r.topicTitle,
              subjectId: r.subjectId,
              subjectName: r.subjectName,
              totalAttempted: 0,
              totalCorrect: 0,
              totalIncorrect: 0,
              testsCount: 0,
              questionTypes: {}
            };
          }
          topicMap[tId].totalAttempted += r.attemptedCount;
          topicMap[tId].totalCorrect += r.correctCount;
          topicMap[tId].totalIncorrect += r.incorrectCount;
          topicMap[tId].testsCount += 1;

          (r.questions || []).forEach(q => {
            if (q.isAttempted) {
              const qType = q.typeCategory || r.topicTitle;
              if (!topicMap[tId].questionTypes[qType]) {
                topicMap[tId].questionTypes[qType] = { name: qType, attempted: 0, correct: 0, incorrect: 0 };
              }
              topicMap[tId].questionTypes[qType].attempted += 1;
              if (q.isCorrect) topicMap[tId].questionTypes[qType].correct += 1;
              else topicMap[tId].questionTypes[qType].incorrect += 1;
            }
          });
        });

        const topicList = Object.values(topicMap).map(t => {
          const acc = t.totalAttempted > 0 ? Math.round((t.totalCorrect / t.totalAttempted) * 100) : 0;
          let category = "strong";
          let badgeText = "Mastered (Strong)";
          let badgeColor = "bg-emerald-500/20 text-emerald-300 border-emerald-500/40";
          let progressColor = "bg-emerald-500";
          let advice = "Solid conceptual mastery! Maintain regular revision.";

          if (acc < 55) {
            category = "critical_weak";
            badgeText = "🚨 Critical Weak Area";
            badgeColor = "bg-rose-500/20 text-rose-300 border-rose-500/40";
            progressColor = "bg-rose-500";
            advice = "High error rate detected. Review fundamental formulas, short-tricks, and concept notes.";
          } else if (acc < 75) {
            category = "moderate_weak";
            badgeText = "⚠️ Needs Practice";
            badgeColor = "bg-amber-500/20 text-amber-300 border-amber-500/40";
            progressColor = "bg-amber-500";
            advice = "Moderate accuracy. Eliminate silly mistakes by practicing timed 15-question sets.";
          }

          const typesArr = Object.values(t.questionTypes).map(qt => ({
            ...qt,
            accuracy: qt.attempted > 0 ? Math.round((qt.correct / qt.attempted) * 100) : 0
          })).sort((a, b) => a.accuracy - b.accuracy);

          return {
            ...t,
            accuracy: acc,
            category,
            badgeText,
            badgeColor,
            progressColor,
            advice,
            types: typesArr
          };
        });

        const weakTopics = topicList
          .filter(t => t.category === "critical_weak" || t.category === "moderate_weak")
          .sort((a, b) => a.accuracy - b.accuracy);

        const strongTopics = topicList
          .filter(t => t.category === "strong")
          .sort((a, b) => b.accuracy - a.accuracy);

        // Subject comparison cards
        const subjectsBreakdown = ["quant", "reasoning", "english"].map(sId => {
          const sRecords = records.filter(r => r.subjectId === sId);
          let sAttempted = 0, sCorrect = 0, sScore = 0;
          sRecords.forEach(r => {
            sAttempted += r.attemptedCount;
            sCorrect += r.correctCount;
            sScore += r.score;
          });
          const sAcc = sAttempted > 0 ? Math.round((sCorrect / sAttempted) * 100) : 0;
          return {
            id: sId,
            name: SYLLABUS_DATA[sId]?.name || sId,
            shortName: SYLLABUS_DATA[sId]?.shortName || sId,
            testsCount: sRecords.length,
            attempted: sAttempted,
            correct: sCorrect,
            score: Math.round(sScore * 10) / 10,
            accuracy: sAcc
          };
        });

        return {
          totalQuestions,
          totalAttempted,
          totalCorrect,
          totalIncorrect,
          totalScore: Math.round(totalScore * 10) / 10,
          accuracy,
          weakTopics,
          strongTopics,
          allTopics: topicList,
          subjectsBreakdown,
          records: filtered
        };
      }, [performanceRecords, analyticsSubjectFilter]);

      // Global Live Stats for Top Navbar & Hub
      const globalOverallStats = useMemo(() => {
        let attempted = 0, correct = 0;
        performanceRecords.forEach(r => {
          attempted += r.attemptedCount || 0;
          correct += r.correctCount || 0;
        });
        const acc = attempted > 0 ? Math.round((correct / attempted) * 100) : 0;
        return { attempted, correct, accuracy: acc, totalTests: performanceRecords.length };
      }, [performanceRecords]);

      const currentQ = questions[currentIndex];
      const currentFeedback = feedbacks[currentQ?.question_number];

      // Exact Database Field Rendering based on Language Toggle
      const currentQuestionText = (language === 'HI' && currentQ?.question_text_hi) ? currentQ.question_text_hi : currentQ?.question_text;

                                  onClick={() => setLanguage('HI')}
                                  className={`px-2.5 py-0.5 rounded-full transition ${language === 'HI' ? 'bg-emerald-700 text-white' : 'text-emerald-800 hover:bg-emerald-100'}`}

                                {currentShortcut}

                    {/* 4. Identified Weak Areas Count */}
                    <div className="bg-white border border-[#E2DDD3] p-4 rounded-2xl shadow-xs">
                      <span className="font-mono text-[10px] font-bold text-[#8C827A] uppercase tracking-wider block truncate">Weak Areas</span>
                      <p className={`font-serif text-2xl sm:text-3xl font-black mt-0.5 ${analyticsData.weakTopics.length > 0 ? "text-rose-700" : "text-emerald-700"}`}>
                        {analyticsData.weakTopics.length} <span className="font-sans text-xs font-normal text-[#8C827A]">Topics</span>
                      </p>
                      <span className="block font-mono text-[10px] text-[#8C827A] font-medium mt-1 truncate">
                        {analyticsData.weakTopics.length > 0 ? "Targeted practice needed" : "Solid proficiency"}
                      </span>
                    </div>

                  </div>

                  {/* TAB 1: WEAK QUESTION TYPES & FOCUS AREAS */}
                  {analyticsActiveTab === "weak_types" && (
                    <div className="space-y-4 sm:space-y-6">

                      <div>
                        <div className="flex items-center justify-between mb-3">
                          <h3 className="font-serif text-base sm:text-lg font-bold text-[#182030] flex items-center gap-1.5">
                            <span>🚨 Identified Weak Topics & Sub-Types</span>
                            <span className="font-mono text-[10px] text-rose-800 bg-rose-100 px-2 py-0.5 rounded-full border border-rose-200">
                              {analyticsData.weakTopics.length} Focus
                            </span>
                          </h3>
                        </div>

                        {analyticsData.weakTopics.length === 0 ? (
                          <div className="bg-white border border-[#E2DDD3] rounded-2xl p-6 sm:p-8 text-center space-y-2">
                            <div className="w-10 h-10 rounded-full bg-emerald-50 text-emerald-700 flex items-center justify-center mx-auto text-lg">
                              ✓
                            </div>
                            <h4 className="font-serif font-bold text-slate-800 text-sm">No Critical Weak Areas Detected</h4>
                            <p className="text-xs text-slate-500 max-w-md mx-auto">
                              Your accuracy across all attempted topics in this filter is above 75%. Keep practicing to maintain exam endurance.
                            </p>
                          </div>
                        ) : (
                          <div className="grid grid-cols-1 md:grid-cols-2 gap-3 sm:gap-4">
                            {analyticsData.weakTopics.map(topic => (
                              <div
                                key={topic.topicId}
                                className="bg-white border border-[#E2DDD3] hover:border-[#CFC6B8] rounded-2xl p-4 sm:p-5 space-y-3 shadow-xs transition"
                              >
                                <div className="flex items-start justify-between gap-2">
                                  <div className="min-w-0">
                                    <div className="flex flex-wrap items-center gap-1.5 mb-1">
                                      <span className="font-mono text-[9px] font-bold px-2 py-0.5 rounded-full uppercase bg-[#EAE5DA] text-slate-800 border border-[#DDD7CC]">
                                        {topic.subjectName}
                                      </span>
                                      <span className="font-mono text-[9px] font-bold px-2 py-0.5 rounded-full border bg-rose-50 text-rose-800 border-rose-200">
                                        {topic.badgeText}
                                      </span>
                                    </div>
                                    <h4 className="font-bold text-[#182030] text-sm leading-snug">
                                      {topic.topicTitle}
                                    </h4>
                                  </div>

                                  <div className="text-right shrink-0">
                                    <span className="font-serif text-lg sm:text-xl font-black text-rose-700">
                                      {topic.accuracy}%
                                    </span>
                                    <span className="block font-mono text-[9px] text-[#8C827A] font-bold uppercase">Accuracy</span>
                                  </div>
                                </div>

                                <div className="space-y-1">
                                  <div className="flex justify-between font-mono text-[10px] text-[#8C827A]">
                                    <span>{topic.totalAttempted} Qs Attempted</span>
                                    <span className="text-rose-700 font-bold">{topic.totalIncorrect} Wrong</span>
                                  </div>
                                  <div className="w-full bg-[#EAE5DA] rounded-full h-1.5 overflow-hidden">
                                    <div
                                      className="h-full bg-rose-600"
                                      style={{ width: `${Math.max(6, topic.accuracy)}%` }}
                                    ></div>
                                  </div>
                                </div>

                                {topic.types && topic.types.length > 0 && (
                                  <div className="space-y-1 pt-2 border-t border-[#F0EBE1]">
                                    <span className="font-mono text-[9px] font-bold text-[#8C827A] uppercase tracking-wider block">
                                      Failing Question Types:
                                    </span>
                                    <div className="space-y-1">
                                      {topic.types.map(tType => (
                                        <div key={tType.name} className="flex items-center justify-between text-xs bg-[#FAF8F5] px-2.5 py-1 rounded-lg border border-[#E5DFD5]">
                                          <span className="text-slate-700 truncate max-w-[170px] sm:max-w-[200px]">{tType.name}</span>
                                          <span className="font-mono font-bold text-[11px] text-rose-700">
                                            {tType.accuracy}% ({tType.correct}/{tType.attempted})
                                          </span>
                                        </div>
                                      ))}
                                    </div>
                                  </div>
                                )}

                                <div className="pt-1">
                                  <button
                                    onClick={() => handleLaunchWeakTopicPractice(topic.subjectId, topic.topicId)}
                                    className="w-full py-2 px-3 bg-[#182030] hover:bg-slate-800 text-white rounded-xl text-xs font-bold transition shadow flex items-center justify-center space-x-1.5"
                                  >
                                    <span>⚡ Practice This Weak Topic Now</span>
                                  </button>
                                </div>

                              </div>
                            ))}
                          </div>
                        )}
                      </div>

                      {/* Mastered Topics Section */}
                      {analyticsData.strongTopics.length > 0 && (
                        <div className="pt-3 border-t border-[#DDD7CC]">
                          <div className="flex items-center justify-between mb-2">
                            <h3 className="font-serif text-sm sm:text-base font-bold text-emerald-800 flex items-center gap-1.5">
                              <span>✓ Mastered & Strong Topics (&gt;75%)</span>
                              <span className="font-mono text-[10px] text-emerald-800 bg-emerald-100 px-2 py-0.5 rounded-full border border-emerald-200">
                                {analyticsData.strongTopics.length}
                              </span>
                            </h3>
                          </div>

                          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2 sm:gap-3">
                            {analyticsData.strongTopics.map(topic => (
                              <div key={topic.topicId} className="bg-white border border-emerald-200 rounded-xl p-3.5 flex items-center justify-between">
                                <div className="min-w-0 pr-2">
                                  <span className="font-mono text-[9px] font-bold uppercase text-emerald-700">{topic.subjectName}</span>
                                  <h5 className="font-bold text-[#182030] text-xs truncate">{topic.topicTitle}</h5>
                                  <span className="font-mono text-[10px] text-[#8C827A]">{topic.totalAttempted} Qs Attempted</span>
                                </div>
                                <div className="text-right shrink-0">
                                  <span className="font-serif text-base font-black text-emerald-700">{topic.accuracy}%</span>
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                    </div>
                  )}

                  {/* TAB 2: SUBJECT MASTERY COMPARISON */}
                  {analyticsActiveTab === "subjects" && (
                    <div className="space-y-3 sm:space-y-4">
                      <h3 className="font-serif text-base sm:text-lg font-bold text-[#182030]">
                        Subject-wise Performance Matrix
                      </h3>

                      <div className="grid grid-cols-1 md:grid-cols-3 gap-3 sm:gap-4">
                        {analyticsData.subjectsBreakdown.map(subj => (
                          <div key={subj.id} className="bg-white border border-[#E2DDD3] rounded-2xl p-5 space-y-3 flex flex-col justify-between shadow-xs">
                            <div>
                              <div className="flex items-center justify-between mb-1.5">
                                <span className="font-mono text-[10px] font-black uppercase text-[#8C827A] tracking-wider">
                                  {subj.shortName}
                                </span>
                                <span className="font-mono text-[10px] font-bold px-2 py-0.5 rounded-full border bg-[#FAF8F5] text-[#182030] border-[#DDD7CC]">
                                  {subj.accuracy}% Accuracy
                                </span>
                              </div>
                              <h4 className="font-serif font-bold text-[#182030] text-base">{subj.name}</h4>
                            </div>

                            <div className="space-y-1.5 bg-[#FAF8F5] p-3 rounded-xl border border-[#E5DFD5] font-mono text-[11px]">
                              <div className="flex justify-between text-slate-600">
                                <span>Tests Completed:</span>
                                <span className="font-bold text-[#182030]">{subj.testsCount}</span>
                              </div>
                              <div className="flex justify-between text-slate-600">
                                <span>Questions Attempted:</span>
                                <span className="font-bold text-[#182030]">{subj.attempted} Qs</span>
                              </div>
                              <div className="flex justify-between text-slate-600">
                                <span>Correct Answers:</span>
                                <span className="font-bold text-emerald-700">{subj.correct}</span>
                              </div>
                              <div className="flex justify-between text-slate-600">
                                <span>Cumulative Score:</span>
                                <span className="font-bold text-[#182030]">{subj.score} pts</span>
                              </div>
                            </div>

                            <button
                              onClick={() => {
                                handleSelectSubject(subj.id);
                                setShowAnalyticsModal(false);
                              }}
                              className="w-full py-2 bg-[#182030] hover:bg-slate-800 text-white rounded-xl text-xs font-bold transition flex items-center justify-center space-x-1"
                            >
                              <span>Explore {subj.shortName} Modules →</span>
                            </button>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* TAB 3: PRACTICE HISTORY LOG */}
                  {analyticsActiveTab === "history" && (
                    <div className="space-y-3 sm:space-y-4">
                      <div className="flex items-center justify-between">
                        <h3 className="font-serif text-base sm:text-lg font-bold text-[#182030]">
                          Test History & Attempt Log
                        </h3>
                        <span className="font-mono text-[11px] text-[#8C827A] font-semibold">{analyticsData.records.length} Tests</span>
                      </div>

                      {analyticsData.records.length === 0 ? (
                        <div className="bg-white border border-[#E2DDD3] rounded-2xl p-6 text-center text-slate-500 text-xs">
                          No practice records recorded yet. Start practicing topics to build your history log.
                        </div>
                      ) : (
                        <div className="overflow-x-auto rounded-2xl border border-[#E2DDD3] bg-white">
                          <table className="w-full text-left text-xs text-slate-700 min-w-[500px]">
                            <thead className="bg-[#FAF8F5] text-[#8C827A] uppercase font-mono font-bold text-[9px] border-b border-[#E2DDD3]">
                              <tr>
                                <th className="px-3.5 py-2.5">Date / Time</th>
                                <th className="px-3.5 py-2.5">Subject & Topic</th>
                                <th className="px-3.5 py-2.5">Set</th>
                                <th className="px-3.5 py-2.5 text-center">Attempted</th>
                                <th className="px-3.5 py-2.5 text-center">Accuracy</th>
                                <th className="px-3.5 py-2.5 text-right">Score</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-[#F0EBE1]">
                              {analyticsData.records.map((rec, idx) => (
                                <tr key={rec.id || idx} className="hover:bg-[#FAF8F5] transition">
                                  <td className="px-3.5 py-2.5 font-mono text-[#8C827A] text-[10px] whitespace-nowrap">{rec.dateStr}</td>
                                  <td className="px-3.5 py-2.5 font-semibold text-slate-900">
                                    <span className="text-[#8C827A] mr-1">[{rec.subjectName}]</span>
                                    {rec.topicTitle}
                                  </td>
                                  <td className="px-3.5 py-2.5 whitespace-nowrap text-slate-500">{rec.practiceSet}</td>
                                  <td className="px-3.5 py-2.5 text-center font-mono font-bold">
                                    <span className="text-emerald-700">{rec.correctCount}</span> / <span className="text-slate-500">{rec.attemptedCount}</span>
                                  </td>
                                  <td className="px-3.5 py-2.5 text-center font-mono font-bold">
                                    <span className={`px-1.5 py-0.5 rounded ${rec.accuracy >= 75 ? "bg-emerald-50 text-emerald-800" : rec.accuracy >= 60 ? "bg-amber-50 text-amber-800" : "bg-rose-50 text-rose-800"
                                      }`}>
                                      {rec.accuracy}%
                                    </span>
                                  </td>
                                  <td className="px-3.5 py-2.5 text-right font-mono font-bold text-[#182030]">+{rec.score}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      )}
                    </div>
                  )}

                </div>

                {/* Modal Footer Utility Toolbar */}
                <div className="p-4 bg-white border-t border-[#E2DDD3] flex flex-col-reverse sm:flex-row items-stretch sm:items-center justify-between gap-2 shrink-0">
                  <div className="grid grid-cols-2 sm:flex items-center gap-1.5">
                    <button
                      onClick={handleLoadSampleData}
                      className="py-1.5 px-3 bg-[#FAF8F5] hover:bg-[#EAE5DA] text-slate-700 rounded-lg text-[11px] font-semibold border border-[#DDD7CC] transition text-center"
                    >
                      ⚡ Load Sample Data
                    </button>
                    <button
                      onClick={handleResetAnalytics}
                      className="py-1.5 px-3 bg-[#FAF8F5] hover:bg-rose-50 text-slate-600 hover:text-rose-700 rounded-lg text-[11px] font-semibold border border-[#DDD7CC] transition text-center"
                    >
                      🗑️ Reset Stats
                    </button>
                  </div>

                  <button
                    onClick={() => setShowAnalyticsModal(false)}
                    className="w-full sm:w-auto px-5 py-2 bg-[#182030] hover:bg-slate-800 text-white rounded-xl text-xs font-bold transition shadow-sm"
                  >
                    Close Diagnostics Tool
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-[#F3EFE6] border-t border-[#E2DDD3] px-4 py-4 text-center text-[11px] text-[#8C827A] mt-auto font-mono">
            <p>© {new Date().getFullYear()} SSC Practice Platform • Testbook-Aligned Syllabus for Quantitative Aptitude, Reasoning & English</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>

</html>
