<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NLP+ | September 2026 Monthly Recap</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #090d16;
      color: #ffffff;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    
    /* Glowing background gradients */
    .bg-aurora {
      background: radial-gradient(circle at 50% 20%, rgba(124, 58, 237, 0.35), transparent 60%),
                  radial-gradient(circle at 80% 80%, rgba(236, 72, 153, 0.25), transparent 50%),
                  radial-gradient(circle at 20% 70%, rgba(6, 182, 212, 0.25), transparent 50%),
                  #090d16;
    }

    /* Animated floating particles */
    @keyframes float-slow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(3deg); }
    }
    .animate-float {
      animation: float-slow 6s ease-in-out infinite;
    }

    /* Glassmorphism card */
    .glass-panel {
      background: rgba(18, 24, 38, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
    }

    /* Pulse glow */
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 0.4; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .animate-pulse-ring {
      animation: pulse-ring 3s infinite ease-in-out;
    }

    /* Slide transition */
    .slide-enter {
      animation: slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: scale(0.96) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
  </style>
</head>

    // --- 2. AUDIO SYNTHESIS (AMBIENT RECAP CHIMES) ---
    let soundEnabled = true;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          audioCtx = new AudioContext();
        }
      }
    }

    function playRecapChime(slideIndex) {
      if (!soundEnabled) return;
      try {
        initAudio();
        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const now = audioCtx.currentTime;
        const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50]; // C, E, G, C5, E5, G5, C6
        const baseFreq = notes[slideIndex % notes.length];

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = slideIndex === 6 ? 'triangle' : 'sine';
        osc.frequency.setValueAtTime(baseFreq, now);
        osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.5, now + 0.35);

        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.65);
      } catch (e) {
        // Audio optional / silent fallback
      }
    }

    // --- 4. PROGRESS BARS SETUP ---
    const progressContainer = document.getElementById("progress-bars-container");
    function setupProgressBars() {
      progressContainer.innerHTML = "";
      for (let i = 0; i < TOTAL_SLIDES; i++) {
        const barWrap = document.createElement("div");
        barWrap.className = "flex-1 h-full bg-white/20 rounded-full overflow-hidden relative cursor-pointer";
        barWrap.onclick = (e) => {
          e.stopPropagation();
          goToSlide(i);
        };

        const fill = document.createElement("div");
        fill.id = `bar-fill-${i}`;
        fill.className = "h-full bg-white rounded-full transition-all duration-75";
        fill.style.width = i < currentSlide ? "100%" : (i === currentSlide ? "0%" : "0%");

        barWrap.appendChild(fill);
        progressContainer.appendChild(barWrap);
      }
    }

    // --- 5. SLIDE NAVIGATION & TIMER ---
    function renderSlide(index) {
      currentSlide = index;
      document.getElementById("slideCounter").textContent = `${currentSlide + 1} of ${TOTAL_SLIDES}`;
      document.getElementById("slide-content").innerHTML = slides[currentSlide]();

      // Update bars
      for (let i = 0; i < TOTAL_SLIDES; i++) {
        const el = document.getElementById(`bar-fill-${i}`);
        if (el) {
          if (i < currentSlide) {
            el.style.width = "100%";
          } else if (i > currentSlide) {
            el.style.width = "0%";
          } else {
            el.style.width = "0%";
          }
        }
      }

      // Play Sound Chime
      playRecapChime(currentSlide);

      // Trigger Confetti on Slide 7
      if (currentSlide === TOTAL_SLIDES - 1) {
        launchConfetti();
      }

      startTimer();
    }

    function startTimer() {
      clearTimeout(slideTimer);
      slideStartTime = Date.now() - elapsedBeforePause;
      elapsedBeforePause = 0;
      isPaused = false;
      document.getElementById("pauseHint").textContent = "Hold to Pause";

      function tick() {
        if (isPaused) return;
        const elapsed = Date.now() - slideStartTime;
        const progress = Math.min(100, (elapsed / SLIDE_DURATION) * 100);

        const currentFill = document.getElementById(`bar-fill-${currentSlide}`);
        if (currentFill) {
          currentFill.style.width = `${progress}%`;
        }

        if (elapsed >= SLIDE_DURATION) {
          if (currentSlide < TOTAL_SLIDES - 1) {
            renderSlide(currentSlide + 1);
          } else {
            // End of story: stay on last slide
            clearTimeout(slideTimer);
          }
        } else {
          slideTimer = setTimeout(tick, 30);
        }
      }

      tick();
    }

    function pauseTimer() {
      if (isPaused) return;
      isPaused = true;
      elapsedBeforePause = Date.now() - slideStartTime;
      clearTimeout(slideTimer);
      document.getElementById("pauseHint").textContent = "Paused";
    }

    function resumeTimer() {
      if (!isPaused) return;
      isPaused = false;
      startTimer();
    }

    function goToSlide(index) {
      if (index >= 0 && index < TOTAL_SLIDES) {
        elapsedBeforePause = 0;
        renderSlide(index);
      }
    }

    function nextSlide() {
      if (currentSlide < TOTAL_SLIDES - 1) {
        goToSlide(currentSlide + 1);
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        goToSlide(currentSlide - 1);
      }
    }

    function restartStory() {
      goToSlide(0);
    }

    // --- 6. EVENT LISTENERS & TOUCH GESTURES ---
    const tapLeft = document.getElementById("tap-left");
    const tapRight = document.getElementById("tap-right");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const storyWrapper = document.getElementById("story-wrapper");

    tapLeft.onclick = () => prevSlide();
    tapRight.onclick = () => nextSlide();
    prevBtn.onclick = () => prevSlide();
    nextBtn.onclick = () => nextSlide();

    // Press-and-hold to pause (desktop & touch)
    let holdTimer = null;
    storyWrapper.addEventListener("mousedown", () => {
      holdTimer = setTimeout(pauseTimer, 150);
    });
    storyWrapper.addEventListener("mouseup", () => {
      clearTimeout(holdTimer);
      resumeTimer();
    });
    storyWrapper.addEventListener("touchstart", () => {
      holdTimer = setTimeout(pauseTimer, 150);
    }, { passive: true });
    storyWrapper.addEventListener("touchend", () => {
      clearTimeout(holdTimer);
      resumeTimer();
    });

    // Keyboard Navigation
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") nextSlide();
      if (e.key === "ArrowLeft") prevSlide();
      if (e.key === " ") {
        if (isPaused) resumeTimer();
        else pauseTimer();
      }
      if (e.key === "Escape") {
        window.location.href = "dashboard.html";
      }
    });

`✨ *NLP+ SSC CGL 2026 MONTHLY RECAP* ✨

        alert("Recap copied to clipboard!");

    // --- 8. LIGHTWEIGHT CANVAS CONFETTI (SLIDE 7) ---
    function launchConfetti() {
      const canvas = document.getElementById("confettiCanvas");
      const ctx = canvas.getContext("2d");
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;

      const particles = [];
      const colors = ["#00E5FF", "#EC4899", "#A855F7", "#10B981", "#F59E0B", "#FFFFFF"];

      for (let i = 0; i < 80; i++) {
        particles.push({
          x: canvas.width * 0.5,
          y: canvas.height * 0.5,
          vx: (Math.random() - 0.5) * 12,
          vy: (Math.random() - 0.7) * 14,
          size: Math.random() * 6 + 3,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotationSpeed: (Math.random() - 0.5) * 8,
          alpha: 1
        });
      }

      let animationFrame;
      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let activeCount = 0;

        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.35; // Gravity
          p.rotation += p.rotationSpeed;
          p.alpha -= 0.012;

          if (p.alpha > 0) {
            activeCount++;
            ctx.save();
            ctx.globalAlpha = p.alpha;
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
            ctx.restore();
          }
        });

        if (activeCount > 0) {
          animationFrame = requestAnimationFrame(render);
        } else {
          cancelAnimationFrame(animationFrame);
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }

      render();
    }

    // Initialize App
    setupProgressBars();
    renderSlide(0);
  </script>
