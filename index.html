<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SSC Practice Platform - Quantitative Aptitude</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', 'Noto Sans Devanagari', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- 1. REPLACE WITH YOUR REAL SUPABASE CREDENTIALS ---
    const SUPABASE_URL = "https://zgxskpqsjylbwrhhrzim.supabase.co"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpneHNrcHFzanlsYndyaGhyemltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczODY0MDIsImV4cCI6MjEwMjk2MjQwMn0.1RSVtWx8gxJhQcmDfJMvRfRLMvl4ju9GuwxgiKn5f8w";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function App() {
      // App Hierarchy States
      const [exam] = useState("SSC Practice");
      const [subject] = useState("Quantitative Aptitude");
      const [topic] = useState("Time and Work");
      const [practiceSet, setPracticeSet] = useState("Practice 1");

      // Quiz Engine States
      const [questions, setQuestions] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [selectedAnswers, setSelectedAnswers] = useState({});
      const [markedForReview, setMarkedForReview] = useState(new Set());
      const [loading, setLoading] = useState(true);
      const [submitted, setSubmitted] = useState(false);

      // Feedback States: { [questionNumber]: 'Good' | 'Neutral' | 'Bad' }
      const [feedbacks, setFeedbacks] = useState({});
      const [feedbackStatus, setFeedbackStatus] = useState(null);

      // Top Bar States
      const [language, setLanguage] = useState("EN");
      const [timeLeft, setTimeLeft] = useState(35 * 60);

      // --- 2. FETCH QUESTIONS FROM SUPABASE ---
      useEffect(() => {
        async function fetchQuestions() {
          setLoading(true);
          try {
            const { data, error } = await supabase
              .from('time_and_work_questions')
              .select('*')
              .eq('practice_set', practiceSet)
              .order('question_number', { ascending: true });

            if (error) throw error;
            setQuestions(data || []);
            
            // Reset state for new practice set
            setSelectedAnswers({});
            setMarkedForReview(new Set());
            setFeedbacks({});
            setCurrentIndex(0);
            setSubmitted(false);
            setTimeLeft(35 * 60);
          } catch (err) {
            console.error("Fetch error:", err.message);
            alert("Error connecting to Supabase. Check your URL and Key in the code.");
          } finally {
            setLoading(false);
          }
        }
        fetchQuestions();
      }, [practiceSet]);

      // --- 3. COUNTDOWN TIMER ---
      useEffect(() => {
        if (submitted) return;
        const timer = setInterval(() => {
          setTimeLeft(prev => {
            if (prev <= 1) {
              clearInterval(timer);
              setSubmitted(true);
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [submitted]);

      const formatTime = (seconds) => {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      };

      // --- 4. QUIZ INTERACTIONS ---
      const handleOptionSelect = (optionKey) => {
        if (submitted) return;
        setSelectedAnswers({ ...selectedAnswers, [currentIndex]: optionKey });
      };

      const toggleReview = () => {
        const updated = new Set(markedForReview);
        if (updated.has(currentIndex)) updated.delete(currentIndex);
        else updated.add(currentIndex);
        setMarkedForReview(updated);
      };

      // --- 5. SUBMIT FEEDBACK TO SUPABASE ---
      const handleFeedbackSubmit = async (rating) => {
        const currentQNum = questions[currentIndex]?.question_number;
        if (!currentQNum) return;

        // Update UI immediately
        setFeedbacks(prev => ({ ...prev, [currentQNum]: rating }));
        setFeedbackStatus("saving");

        try {
          const { error } = await supabase
            .from('question_feedback')
            .insert([{
              practice_set: practiceSet,
              question_number: currentQNum,
              rating: rating
            }]);

          if (error) throw error;
          
          setFeedbackStatus("saved");
          setTimeout(() => setFeedbackStatus(null), 2500); // Hide toast after 2.5s
        } catch (err) {
          console.error("Error saving feedback:", err.message);
          setFeedbackStatus("error");
          setTimeout(() => setFeedbackStatus(null), 3000);
        }
      };

      // --- 6. SCORING ---
      const scoreData = useMemo(() => {
        let correct = 0, incorrect = 0, unattempted = 0;
        questions.forEach((q, idx) => {
          const ans = selectedAnswers[idx];
          if (!ans) unattempted++;
          else if (ans === q.correct_option) correct++;
          else incorrect++;
        });
        const totalScore = (correct * 2) - (incorrect * 0.5); // Standard SSC marking
        return { correct, incorrect, unattempted, totalScore };
      }, [submitted, selectedAnswers, questions]);

      const currentQ = questions[currentIndex];
      const currentFeedback = feedbacks[currentQ?.question_number];

      // Exact Database Field Rendering based on Language Toggle
      const currentQuestionText = (language === 'HI' && currentQ?.question_text_hi) ? currentQ.question_text_hi : currentQ?.question_text;
      const currentOptions = (language === 'HI' && currentQ?.options_hi) ? currentQ.options_hi : (currentQ?.options || {});
      const currentSolution = (language === 'HI' && currentQ?.solution_text_hi) ? currentQ.solution_text_hi : currentQ?.solution_text;

      // Loading Screen
      if (loading) {
        return (
          <div className="flex h-screen items-center justify-center bg-slate-50">
            <div className="text-center">
              <div className="w-12 h-12 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
              <p className="font-semibold text-slate-600">Loading {practiceSet} Questions...</p>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col bg-slate-50">
          
          {/* HEADER & HIERARCHY BAR */}
          <header className="bg-slate-900 text-white border-b border-slate-800 px-6 py-3">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center space-x-2 text-sm font-medium">
                <span className="bg-indigo-600 px-2.5 py-1 rounded text-xs tracking-wider uppercase font-bold">{exam}</span>
                <span className="text-slate-400">/</span>
                <span className="text-slate-300 font-semibold">{subject}</span>
                <span className="text-slate-400">/</span>
                <span className="text-indigo-400 font-bold">{topic}</span>
              </div>

              {/* Practice Set Switcher */}
              <div className="inline-flex rounded-lg bg-slate-800 p-1 border border-slate-700">
                <button
                  onClick={() => setPracticeSet("Practice 1")}
                  className={`px-4 py-1.5 rounded-md text-xs font-bold transition ${
                    practiceSet === "Practice 1" ? "bg-indigo-600 text-white shadow" : "text-slate-300 hover:text-white"
                  }`}
                >
                  Practice 1 (35 Qs)
                </button>
                <button
                  onClick={() => setPracticeSet("Practice 2")}
                  className={`px-4 py-1.5 rounded-md text-xs font-bold transition ${
                    practiceSet === "Practice 2" ? "bg-indigo-600 text-white shadow" : "text-slate-300 hover:text-white"
                  }`}
                >
                  Practice 2 (35 Qs)
                </button>
              </div>
            </div>
          </header>

          {/* PARALLEL TOP BAR: TIMER & LANGUAGE SWITCHER */}
          <div className="bg-white border-b border-slate-200 px-6 py-3 shadow-sm sticky top-0 z-10">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              
              {/* Question Context Details */}
              <div className="flex items-center space-x-3">
                <span className="text-lg font-bold text-slate-800">
                  Question {currentIndex + 1} <span className="text-slate-400 text-sm font-normal">of {questions.length}</span>
                </span>
                <span className="bg-indigo-50 text-indigo-700 text-xs px-2.5 py-1 rounded-full font-bold border border-indigo-100">
                  {currentQ?.level}
                </span>
                <span className="hidden md:inline-block bg-slate-100 text-slate-600 text-xs px-2.5 py-1 rounded-full font-medium">
                  {currentQ?.type_category}
                </span>
              </div>

              <div className="flex items-center space-x-4">
                {/* Language Switcher */}
                <div className="flex items-center bg-slate-100 p-1 rounded-lg border border-slate-300">
                  <button
                    onClick={() => setLanguage("EN")}
                    className={`px-3 py-1 text-xs font-bold rounded transition ${
                      language === "EN" ? "bg-indigo-600 text-white shadow-sm" : "text-slate-600 hover:text-slate-900"
                    }`}
                  >
                    English
                  </button>
                  <button
                    onClick={() => setLanguage("HI")}
                    className={`px-3 py-1 text-xs font-bold rounded transition ${
                      language === "HI" ? "bg-indigo-600 text-white shadow-sm" : "text-slate-600 hover:text-slate-900"
                    }`}
                  >
                    हिन्दी (Hindi)
                  </button>
                </div>

                {/* Countdown Timer */}
                <div className="flex items-center space-x-2 bg-slate-900 text-white px-4 py-1.5 rounded-lg shadow-sm">
                  <svg className="w-4 h-4 text-emerald-400 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                  <span className="font-mono text-sm font-bold tracking-wider">{formatTime(timeLeft)}</span>
                </div>
              </div>

            </div>
          </div>

          {/* MAIN QUIZ WORKSPACE */}
          <main className="max-w-7xl mx-auto w-full p-6 grid grid-cols-1 lg:grid-cols-4 gap-6 flex-1">
            
            {/* LEFT AREA: QUESTION, OPTIONS & FEEDBACK (3 Columns) */}
            <div className="lg:col-span-3 space-y-6">
              <div className="bg-white p-6 md:p-8 rounded-xl shadow-sm border border-slate-200">
                
                {/* Question Statement */}
                <div className="mb-6">
                  <p className="text-slate-900 text-base md:text-lg font-semibold leading-relaxed">
                    {currentQuestionText}
                  </p>
                </div>

                {/* Options List */}
                <div className="space-y-3">
                  {Object.entries(currentOptions).map(([key, val]) => {
                    const isSelected = selectedAnswers[currentIndex] === key;
                    const isCorrect = submitted && key === currentQ.correct_option;
                    const isWrong = submitted && isSelected && key !== currentQ.correct_option;

                    let optionStyle = "border-slate-200 hover:border-indigo-400 hover:bg-slate-50 bg-white";
                    if (isSelected) optionStyle = "border-indigo-600 bg-indigo-50/60 ring-2 ring-indigo-500/20";
                    if (isCorrect) optionStyle = "border-emerald-600 bg-emerald-50 text-emerald-900 ring-2 ring-emerald-500/20";
                    if (isWrong) optionStyle = "border-rose-600 bg-rose-50 text-rose-900 ring-2 ring-rose-500/20";

                    return (
                      <div
                        key={key}
                        onClick={() => handleOptionSelect(key)}
                        className={`flex items-center p-4 rounded-xl border transition-all cursor-pointer select-none ${optionStyle}`}
                      >
                        <span className={`w-8 h-8 rounded-lg flex items-center justify-center font-bold text-sm mr-4 border ${
                          isSelected ? "bg-indigo-600 text-white border-indigo-600" : "bg-slate-100 text-slate-700 border-slate-300"
                        }`}>
                          {key.toUpperCase()}
                        </span>
                        <span className="text-slate-800 font-medium text-sm md:text-base">
                          {val}
                        </span>
                      </div>
                    );
                  })}
                </div>

                {/* --- QUALITY FEEDBACK BAR --- */}
                <div className="mt-8 pt-5 border-t border-slate-100 flex flex-wrap items-center justify-between gap-3 bg-slate-50/70 p-4 rounded-xl border border-slate-200/80">
                  <div className="flex items-center space-x-2">
                    <svg className="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" />
                    </svg>
                    <span className="text-sm font-semibold text-slate-700">
                      {language === 'HI' ? "प्रश्न की गुणवत्ता कैसी लगी?" : "Rate Question Quality:"}
                    </span>
                  </div>

                  <div className="flex items-center space-x-2">
                    <button
                      onClick={() => handleFeedbackSubmit('Good')}
                      className={`px-3 py-1.5 rounded-lg text-sm font-bold border transition flex items-center space-x-1.5 ${
                        currentFeedback === 'Good'
                          ? "bg-emerald-600 text-white border-emerald-600 shadow-sm"
                          : "bg-white text-slate-700 border-slate-300 hover:bg-emerald-50 hover:border-emerald-300"
                      }`}
                    >
                      <span>👍</span>
                      <span className="hidden sm:inline">{language === 'HI' ? "अच्छी (Good)" : "Good"}</span>
                    </button>

                    <button
                      onClick={() => handleFeedbackSubmit('Neutral')}
                      className={`px-3 py-1.5 rounded-lg text-sm font-bold border transition flex items-center space-x-1.5 ${
                        currentFeedback === 'Neutral'
                          ? "bg-slate-700 text-white border-slate-700 shadow-sm"
                          : "bg-white text-slate-700 border-slate-300 hover:bg-slate-100 hover:border-slate-400"
                      }`}
                    >
                      <span>😐</span>
                      <span className="hidden sm:inline">{language === 'HI' ? "सामान्य (Neutral)" : "Neutral"}</span>
                    </button>

                    <button
                      onClick={() => handleFeedbackSubmit('Bad')}
                      className={`px-3 py-1.5 rounded-lg text-sm font-bold border transition flex items-center space-x-1.5 ${
                        currentFeedback === 'Bad'
                          ? "bg-rose-600 text-white border-rose-600 shadow-sm"
                          : "bg-white text-slate-700 border-slate-300 hover:bg-rose-50 hover:border-rose-300"
                      }`}
                    >
                      <span>👎</span>
                      <span className="hidden sm:inline">{language === 'HI' ? "खराब (Bad)" : "Bad"}</span>
                    </button>
                  </div>
                </div>
                
                {/* Feedback Toast Message */}
                {feedbackStatus === 'saved' && (
                  <p className="text-right text-xs text-emerald-600 font-semibold mt-2">
                    ✓ {language === 'HI' ? "आपकी प्रतिक्रिया सुरक्षित हो गई है!" : "Feedback saved successfully!"}
                  </p>
                )}
                {feedbackStatus === 'error' && (
                  <p className="text-right text-xs text-rose-600 font-semibold mt-2">
                    ✗ {language === 'HI' ? "प्रतिक्रिया सुरक्षित करने में त्रुटि।" : "Error saving feedback."}
                  </p>
                )}

                {/* Solution Box (Appears on Submit) */}
                {submitted && (
                  <div className="mt-8 p-5 bg-indigo-50/60 border border-indigo-200 rounded-xl space-y-2 animate-fade-in">
                    <div className="flex items-center space-x-2 text-indigo-950 font-bold">
                      <svg className="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                      </svg>
                      <span>Correct Answer: Option ({currentQ?.correct_option?.toUpperCase()})</span>
                    </div>
                    <p className="text-slate-800 text-sm md:text-base leading-relaxed whitespace-pre-line font-mono bg-white p-4 rounded-lg border border-indigo-100">
                      {currentSolution}
                    </p>
                  </div>
                )}
              </div>

              {/* Action Navigation Buttons */}
              <div className="flex flex-wrap items-center justify-between gap-4">
                <div className="flex items-center space-x-3">
                  <button
                    onClick={toggleReview}
                    className={`px-4 py-2 rounded-lg text-sm font-semibold border transition ${
                      markedForReview.has(currentIndex)
                        ? "bg-amber-100 border-amber-400 text-amber-900"
                        : "bg-white border-slate-300 text-slate-700 hover:bg-slate-50"
                    }`}
                  >
                    {markedForReview.has(currentIndex) ? "Marked for Review" : "Mark for Review"}
                  </button>
                  <button
                    onClick={() => {
                      const updated = { ...selectedAnswers };
                      delete updated[currentIndex];
                      setSelectedAnswers(updated);
                    }}
                    className="px-4 py-2 rounded-lg text-sm font-semibold bg-white border border-slate-300 text-slate-600 hover:bg-slate-50"
                  >
                    Clear Response
                  </button>
                </div>

                <div className="flex items-center space-x-3">
                  <button
                    disabled={currentIndex === 0}
                    onClick={() => setCurrentIndex(prev => prev - 1)}
                    className="px-5 py-2 rounded-lg text-sm font-bold bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 disabled:opacity-50"
                  >
                    Previous
                  </button>
                  {currentIndex < questions.length - 1 ? (
                    <button
                      onClick={() => setCurrentIndex(prev => prev + 1)}
                      className="px-6 py-2 rounded-lg text-sm font-bold bg-indigo-600 text-white hover:bg-indigo-700 shadow-sm"
                    >
                      Save & Next
                    </button>
                  ) : (
                    <button
                      onClick={() => setSubmitted(true)}
                      className="px-6 py-2 rounded-lg text-sm font-bold bg-emerald-600 text-white hover:bg-emerald-700 shadow-sm"
                    >
                      Submit Test
                    </button>
                  )}
                </div>
              </div>
            </div>

            {/* RIGHT AREA: QUESTION PALETTE & SCORECARD (1 Column) */}
            <div className="space-y-6">
              
              {/* Scorecard Widget (Visible on Submit) */}
              {submitted && (
                <div className="bg-white p-5 rounded-xl shadow-sm border border-emerald-200 animate-fade-in">
                  <h3 className="font-bold text-slate-900 text-sm mb-3">Performance Scorecard</h3>
                  <div className="grid grid-cols-2 gap-2 text-center text-xs">
                    <div className="p-2 bg-emerald-50 text-emerald-900 rounded-lg border border-emerald-100">
                      <span className="block font-bold text-base">{scoreData.correct}</span>
                      Correct (+{scoreData.correct * 2})
                    </div>
                    <div className="p-2 bg-rose-50 text-rose-900 rounded-lg border border-rose-100">
                      <span className="block font-bold text-base">{scoreData.incorrect}</span>
                      Wrong (-{scoreData.incorrect * 0.5})
                    </div>
                  </div>
                  <div className="mt-3 pt-3 border-t text-center">
                    <span className="text-xs text-slate-500 font-semibold uppercase">Total Score</span>
                    <p className="text-xl font-extrabold text-indigo-700">{scoreData.totalScore} / {questions.length * 2}</p>
                  </div>
                </div>
              )}

              {/* Question Palette Grid */}
              <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <h3 className="font-bold text-slate-900 text-sm mb-4">Question Palette</h3>
                <div className="grid grid-cols-5 gap-2">
                  {questions.map((_, idx) => {
                    const isAnswered = selectedAnswers[idx] !== undefined;
                    const isReview = markedForReview.has(idx);
                    const isCurrent = idx === currentIndex;

                    let btnColor = "bg-slate-100 text-slate-700 border-slate-200 hover:bg-slate-200";
                    if (isAnswered) btnColor = "bg-emerald-500 text-white border-emerald-600 font-bold";
                    if (isReview) btnColor = "bg-amber-400 text-slate-900 border-amber-500 font-bold";
                    if (isCurrent) btnColor += " ring-2 ring-indigo-600 ring-offset-2";

                    return (
                      <button
                        key={idx}
                        onClick={() => setCurrentIndex(idx)}
                        className={`h-9 rounded-lg text-xs font-semibold border flex items-center justify-center transition-all ${btnColor}`}
                      >
                        {idx + 1}
                      </button>
                    );
                  })}
                </div>

                {/* Status Legend */}
                <div className="mt-6 pt-4 border-t border-slate-100 grid grid-cols-2 gap-2 text-[11px] text-slate-600 font-medium">
                  <div className="flex items-center space-x-2">
                    <span className="w-3 h-3 rounded bg-emerald-500"></span>
                    <span>Answered</span>
                  </div>
                  <div className="flex items-center space-x-2">
                    <span className="w-3 h-3 rounded bg-slate-200"></span>
                    <span>Unanswered</span>
                  </div>
                  <div className="flex items-center space-x-2">
                    <span className="w-3 h-3 rounded bg-amber-400"></span>
                    <span>Review</span>
                  </div>
                  <div className="flex items-center space-x-2">
                    <span className="w-3 h-3 rounded border-2 border-indigo-600"></span>
                    <span>Current</span>
                  </div>
                </div>
              </div>
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
