<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SSC Practice Platform - Select Aspirant Profile</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400..800;1,6..72,400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #F3EFE6;
      color: #2D3748;
      -webkit-text-size-adjust: 100%;
    }
    #root {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      background-color: #F3EFE6;
    }
    .font-serif {
      font-family: 'Newsreader', Georgia, serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .glass-card {
      background: #FFFFFF;
      border: 1px solid #E2DDD3;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    }
    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.92; transform: scale(1.02); }
    }
    .animate-pulse-subtle {
      animation: pulse-subtle 2.5s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-[#F3EFE6] text-slate-800 min-h-screen relative overflow-x-hidden flex flex-col justify-between w-full max-w-full">
  <div id="root" class="w-full max-w-full overflow-x-hidden bg-[#F3EFE6]"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- 1. SUPABASE CLIENT CREDENTIALS ---
    const SUPABASE_URL = "https://aehyjzgymhxzcrgxzdly.supabase.co"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFlaHlqemd5bWh4emNyZ3h6ZGx5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2MjA4MDcsImV4cCI6MjEwNTE5NjgwN30.1xE3uGOivEwyuFRVh5Eftf5zTbYftjRyBn8JvYM9_Ck";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // --- 2. THREE DESIGNATED USERS: NITIN, OM, $H ---
    const AUTHORIZED_USERS = [
      {
        id: "Nitin",
        name: "Nitin",
        displayName: "Nitin",
        avatar: "🧑‍💻",
        role: "Quant Specialist",
        specialty: "Advanced Mathematics & Incomes Analysis",
        badge: "Rank 1 Aspirant",
        borderActive: "border-[#182030]",
        bgActive: "bg-[#182030] text-white",
        tagBg: "bg-blue-100 text-blue-800"
      },
      {
        id: "Om",
        name: "Om",
        displayName: "Om",
        avatar: "⚡",
        role: "Speed Master",
        specialty: "35-Minute Speed Drills & Rapid Shortcuts",
        badge: "Accuracy Specialist",
        borderActive: "border-amber-600",
        bgActive: "bg-amber-600 text-white",
        tagBg: "bg-amber-100 text-amber-800"
      },
      {
        id: "$H",
        name: "$H",
        displayName: "$H",
        avatar: "👑",
        role: "Exam Ranker",
        specialty: "Target 50/50 in Quant Tier-1 & Mains",
        badge: "PYQ+ Ranker",
        borderActive: "border-emerald-700",
        bgActive: "bg-emerald-700 text-white",
        tagBg: "bg-emerald-100 text-emerald-800"
      }
    ];

    function AuthApp() {
      // Default to last logged in user or Nitin
      const [selectedUserId, setSelectedUserId] = useState(() => {
        const saved = localStorage.getItem("ssc_active_user");
        if (saved && (saved === "Nitin" || saved === "Om" || saved === "$H")) {
          return saved;
        }
        return "Nitin";
      });

      const [loading, setLoading] = useState(false);
      const [message, setMessage] = useState(null);
      const [userAttemptCounts, setUserAttemptCounts] = useState({});

      useEffect(() => {
        async function fetchCounts() {
          try {
            const { data } = await supabase
              .from('user_question_responses')
              .select('user_name, chapter_id, practice_set, question_number');
            if (data && data.length > 0) {
              const counts = { Nitin: new Set(), Om: new Set(), '$H': new Set() };
              data.forEach(item => {
                if (counts[item.user_name]) {
                  counts[item.user_name].add(`${item.chapter_id}::${item.practice_set}::${item.question_number}`);
                }
              });
              setUserAttemptCounts({
                Nitin: counts.Nitin ? counts.Nitin.size : 0,
                Om: counts.Om ? counts.Om.size : 0,
                '$H': counts['$H'] ? counts['$H'].size : 0
              });
            }
          } catch (e) {
            console.warn("Could not load user stats:", e);
          }
        }
        fetchCounts();
      }, []);

      const activeUserObj = AUTHORIZED_USERS.find(u => u.id === selectedUserId) || AUTHORIZED_USERS[0];

      const showAlert = (type, text, duration = 4000) => {
        setMessage({ type, text });
        if (duration > 0) {
          setTimeout(() => setMessage(null), duration);
        }
      };

      // Handle user login and redirect
      const handleLogin = async (userObj) => {
        setLoading(true);
        showAlert("info", `Authenticating profile for ${userObj.displayName}...`);

        try {
          // 1. Save active user to localStorage for instant cross-tab recognition
          localStorage.setItem("ssc_active_user", userObj.name);
          localStorage.setItem("ssc_user_profile", JSON.stringify(userObj));

          // 2. Sync / touch user session in Supabase `app_users` table
          try {
            await supabase
              .from('app_users')
              .upsert({
                user_name: userObj.name,
                display_name: userObj.displayName,
                avatar: userObj.avatar,
                role: userObj.role,
                last_active_at: new Date().toISOString()
              }, { onConflict: 'user_name' });
          } catch (dbErr) {
            console.warn("Supabase user heartbeat warning:", dbErr.message);
          }

          showAlert("success", `Welcome back, ${userObj.name}! Opening practice portal...`);
          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 600);
        } catch (err) {
          console.error("Login process error:", err);
          showAlert("error", "Error setting active session. Redirecting to dashboard...");
          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 1000);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen flex flex-col justify-between p-4 sm:p-6 lg:p-8 bg-[#F3EFE6] text-slate-800">
          
          {/* TOP NAV BAR */}
          <header className="max-w-6xl mx-auto w-full flex items-center justify-between py-2 border-b border-[#E2DDD3] pb-4">
            <div className="flex items-center space-x-3">
              <div className="w-10 h-10 rounded-2xl bg-[#182030] text-white border border-[#DDD7CC] flex items-center justify-center text-lg shadow-sm">
                📚
              </div>
              <div>
                <span className="font-extrabold text-base text-[#182030] tracking-tight">Practice<span className="text-[#8C827A]">Pro</span></span>
                <span className="block font-mono text-[10px] font-bold text-[#8C827A] tracking-wider uppercase -mt-0.5">SSC Aspirants Official Portal</span>
              </div>
            </div>

            <div className="flex items-center space-x-2">
              <span className="inline-flex items-center space-x-1.5 text-xs font-bold text-[#182030] bg-[#EAE5DA] border border-[#DDD7CC] px-3.5 py-1.5 rounded-full font-mono">
                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>3 Registered Profiles Active</span>
              </span>
            </div>
          </header>

          {/* MAIN CONTAINER */}
          <main className="max-w-6xl mx-auto w-full my-auto py-8 grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12 items-center">
            
            {/* LEFT COLUMN: HERO VALUE PROPOSITION & CAPABILITIES */}
            <div className="lg:col-span-6 space-y-6 text-left">
              <div className="inline-flex items-center space-x-2 bg-[#EAE5DA] border border-[#DDD7CC] px-3.5 py-1 rounded-full text-xs font-bold text-[#4A453E]">
                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>Live Supabase Cloud Sync Enabled</span>
              </div>

              <h1 className="font-serif text-3xl sm:text-4xl lg:text-5xl font-black text-[#182030] leading-tight tracking-tight">
                Welcome to the Personalized SSC Exam & Practice Portal
              </h1>

              <p className="text-[#4A453E] text-sm sm:text-base leading-relaxed max-w-xl">
                Every question response, time per question, 10-star difficulty rating, and final test score is tracked individually in Supabase for <strong>Nitin</strong>, <strong>Om</strong>, and <strong>$H</strong>.
              </p>

              {/* Feature Badges */}
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                <div className="flex items-start space-x-3 bg-white border border-[#E2DDD3] p-3.5 rounded-2xl shadow-xs">
                  <div className="w-8 h-8 rounded-xl bg-[#FAF8F5] border border-[#E5DFD5] text-slate-700 flex items-center justify-center shrink-0 text-sm">
                    ⭐
                  </div>
                  <div>
                    <h2 className="text-xs font-bold text-[#182030]">10-Star Question Ratings</h2>
                    <p className="text-[11px] text-[#8C827A]">Rate question quality 1 to 10 on every question.</p>
                  </div>
                </div>

                <div className="flex items-start space-x-3 bg-white border border-[#E2DDD3] p-3.5 rounded-2xl shadow-xs">
                  <div className="w-8 h-8 rounded-xl bg-[#FAF8F5] border border-[#E5DFD5] text-slate-700 flex items-center justify-center shrink-0 text-sm">
                    📊
                  </div>
                  <div>
                    <h2 className="text-xs font-bold text-[#182030]">Chapter Tables in Supabase</h2>
                    <p className="text-[11px] text-[#8C827A]">Dedicated tables for Ratio, Average, Percentages & Work.</p>
                  </div>
                </div>

                <div className="flex items-start space-x-3 bg-white border border-[#E2DDD3] p-3.5 rounded-2xl shadow-xs">
                  <div className="w-8 h-8 rounded-xl bg-[#FAF8F5] border border-[#E5DFD5] text-slate-700 flex items-center justify-center shrink-0 text-sm">
                    🎯
                  </div>
                  <div>
                    <h2 className="text-xs font-bold text-[#182030]">Real SSC Tier-1 Marking</h2>
                    <p className="text-[11px] text-[#8C827A]">+2 for Correct, -0.5 for Wrong with All India Ranks.</p>
                  </div>
                </div>

                <div className="flex items-start space-x-3 bg-white border border-[#E2DDD3] p-3.5 rounded-2xl shadow-xs">
                  <div className="w-8 h-8 rounded-xl bg-[#FAF8F5] border border-[#E5DFD5] text-slate-700 flex items-center justify-center shrink-0 text-sm">
                    🌐
                  </div>
                  <div>
                    <h2 className="text-xs font-bold text-[#182030]">100% Bilingual Sets</h2>
                    <p className="text-[11px] text-[#8C827A]">Instant toggle between English and हिन्दी for all sets.</p>
                  </div>
                </div>
              </div>
            </div>

            {/* RIGHT COLUMN: 3-USER PROFILE SELECTION CARD */}
            <div className="lg:col-span-6 w-full">
              <div className="bg-white rounded-3xl p-6 sm:p-8 shadow-[0_4px_24px_rgba(0,0,0,0.04)] border border-[#E2DDD3] text-slate-800 relative">
                
                {/* Header */}
                <div className="mb-5 text-left">
                  <div className="flex items-center justify-between mb-1">
                    <span className="font-mono text-[10px] uppercase font-bold text-[#8C827A] tracking-wider">
                      SELECT ASPIRANT PROFILE
                    </span>
                    <span className="font-mono text-[10px] text-emerald-800 font-bold bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-200">
                      ✓ Zero Guest Access
                    </span>
                  </div>
                  <h3 className="font-serif text-2xl font-black text-[#182030]">
                    Who is practicing today?
                  </h3>
                  <p className="text-xs text-[#8C827A] mt-1">
                    Choose your account below. Your test submissions, question answers, and 10-star ratings will be logged under your name.
                  </p>
                </div>

                {/* Dynamic Alert Banner */}
                {message && (
                  <div className={`p-3.5 rounded-2xl text-xs font-semibold mb-4 border flex items-start space-x-2 ${
                    message.type === 'success' ? 'bg-emerald-50 border-emerald-300 text-emerald-900' :
                    message.type === 'error' ? 'bg-rose-50 border-rose-300 text-rose-900' :
                    'bg-[#FAF8F5] border-[#DDD7CC] text-slate-800'
                  }`}>
                    <span className="shrink-0 font-bold">
                      {message.type === 'success' ? '✓' : message.type === 'error' ? '✕' : 'ℹ'}
                    </span>
                    <span>{message.text}</span>
                  </div>
                )}

                {/* Three Profile Option Cards */}
                <div className="space-y-3 mb-6">
                  {AUTHORIZED_USERS.map((user) => {
                    const isSelected = selectedUserId === user.id;
                    return (
                      <div
                        key={user.id}
                        onClick={() => setSelectedUserId(user.id)}
                        className={`p-4 rounded-2xl border-2 transition-all cursor-pointer flex items-center justify-between gap-3 text-left ${
                          isSelected
                            ? "border-[#182030] bg-[#FAF8F5] shadow-sm scale-[1.01]"
                            : "border-[#EAE5DA] bg-white hover:border-[#DDD7CC] hover:bg-[#FAF8F5]"
                        }`}
                      >
                        <div className="flex items-center space-x-3.5">
                          <div className={`w-12 h-12 rounded-2xl flex items-center justify-center text-2xl border shadow-xs transition ${
                            isSelected
                              ? "bg-[#182030] text-white border-[#182030]"
                              : "bg-[#F4F0E8] border-[#DDD7CC]"
                          }`}>
                            {user.avatar}
                          </div>
                          <div>
                            <div className="flex items-center space-x-2 flex-wrap gap-y-1">
                              <h4 className="font-serif font-black text-lg text-[#182030] leading-none">
                                {user.displayName}
                              </h4>
                              <span className="font-mono text-[10px] font-bold px-2 py-0.5 rounded-full bg-[#EAE5DA] text-[#4A453E] border border-[#DDD7CC]">
                                {user.badge}
                              </span>
                              {userAttemptCounts[user.id] > 0 && (
                                <span className="font-mono text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-800 border border-emerald-200">
                                  📊 {userAttemptCounts[user.id]} Qs Attempted
                                </span>
                              )}
                            </div>
                            <p className="text-xs font-semibold text-[#8C827A] mt-1">
                              {user.role} • <span className="font-normal text-[#4A453E]">{user.specialty}</span>
                            </p>
                          </div>
                        </div>

                        {/* Radio Check Indicator */}
                        <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center transition shrink-0 ${
                          isSelected
                            ? "border-[#182030] bg-[#182030] text-white"
                            : "border-[#DDD7CC] bg-white"
                        }`}>
                          {isSelected && <span className="text-xs font-bold">✓</span>}
                        </div>
                      </div>
                    );
                  })}
                </div>

                {/* Primary Launch Button */}
                <button
                  type="button"
                  disabled={loading}
                  onClick={() => handleLogin(activeUserObj)}
                  className="w-full py-3.5 px-5 rounded-2xl bg-[#182030] hover:bg-slate-800 text-white font-bold text-sm transition shadow-sm flex items-center justify-center space-x-2 disabled:opacity-60"
                >
                  {loading ? (
                    <div className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                  ) : (
                    <>
                      <span>Enter Portal as {activeUserObj.name}</span>
                      <span className="text-base font-mono">→</span>
                    </>
                  )}
                </button>

                {/* Real-Exam Mock Test Direct Link */}
                <div className="pt-2.5">
                  <a
                    href="mock_tests.html"
                    className="w-full py-2.5 px-4 rounded-xl border border-teal-600/30 bg-teal-50 hover:bg-teal-100 text-teal-900 text-xs font-bold transition flex items-center justify-between shadow-2xs group"
                  >
                    <div className="flex items-center space-x-2">
                      <span className="text-amber-500">⚡</span>
                      <span>Launch Real-Exam Mock Test</span>
                      <span className="bg-[#00A8B5] text-white text-[9px] font-black px-1.5 py-0.5 rounded tracking-wide">NLP+</span>
                    </div>
                    <span className="text-teal-700 group-hover:translate-x-0.5 transition-transform font-bold">→</span>
                  </a>
                </div>

                {/* Footer Note */}
                <div className="mt-4 pt-3 border-t border-[#F0EBE1] flex items-center justify-between text-[11px] font-mono text-[#8C827A]">
                  <span>Active Profile: <strong>{activeUserObj.name}</strong></span>
                  <span>Responses sync to Supabase</span>
                </div>

              </div>
            </div>
          </main>

          {/* FOOTER */}
          <footer className="max-w-6xl mx-auto w-full text-center py-4 border-t border-[#E2DDD3] font-mono text-[11px] text-[#8C827A]">
            <p>© {new Date().getFullYear()} SSC Practice Platform • Dedicated to Nitin, Om & $H</p>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AuthApp />);
  </script>
</body>
</html>
