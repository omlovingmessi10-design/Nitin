    // Helper: Fast KaTeX Renderer
    const renderMathText = (text) => {
      if (!text) return "";
      const parts = text.split(/(\$\$[\s\S]*?\$\$|\$[^$]*?\$)/g);
      return parts.map((part, index) => {
        if (part.startsWith("$$") && part.endsWith("$$")) {
          const math = part.slice(2, -2);
          try {
            const html = window.katex ? window.katex.renderToString(math, { displayMode: true, throwOnError: false }) : math;
            return <span key={index} dangerouslySetInnerHTML={{ __html: html }} className="my-2 block text-center" />;
          } catch (e) {
            return <span key={index}>{part}</span>;
          }
        } else if (part.startsWith("$") && part.endsWith("$")) {
          const math = part.slice(1, -1);
          try {
            const html = window.katex ? window.katex.renderToString(math, { displayMode: false, throwOnError: false }) : math;
            return <span key={index} dangerouslySetInnerHTML={{ __html: html }} className="inline-block px-0.5" />;
          } catch (e) {
            return <span key={index}>{part}</span>;
          }
        }
        return part;
      });
    };

        let answered = 0;
        let notAnswered = 0;
        let markedReview = 0;
        let notVisited = 0;
        let answeredMarked = 0;

        currentPartQuestions.forEach(q => {
          const st = statuses[q.question_number];
          if (st === 'answered') answered++;
          else if (st === 'not_answered') notAnswered++;
          else if (st === 'marked_review') markedReview++;
          else if (st === 'answered_marked_review') answeredMarked++;
          else notVisited++;
        });

        return { answered, notAnswered, markedReview, notVisited, answeredMarked };
      }, [statuses, currentPartQuestions]);

      // Overall Counts for Summary Modal
      const overallCounts = useMemo(() => {
        let answered = 0;
        let notAnswered = 0;
        let markedReview = 0;
        let notVisited = 0;
        let answeredMarked = 0;

        questions.forEach(q => {
          const st = statuses[q.question_number];
          if (st === 'answered') answered++;
          else if (st === 'not_answered') notAnswered++;
          else if (st === 'marked_review') markedReview++;
          else if (st === 'answered_marked_review') answeredMarked++;
          else notVisited++;
        });

        return { answered, notAnswered, markedReview, notVisited, answeredMarked };
      }, [statuses, questions]);

      const handleStartTest = () => {
        if (!defaultLanguage) {
          alert("Please choose your default language before beginning the test.");
          return;
        }
        if (!agreedDeclaration) {
          alert("Please acknowledge the declaration checkbox.");
          return;
        }

        // Initialize question statuses: Question 1 is 'not_answered' (visited), others 'not_visited'
        const initialStatuses = {};
        questions.forEach((q, idx) => {
          initialStatuses[q.question_number] = idx === 0 ? 'not_answered' : 'not_visited';
        });
        setStatuses(initialStatuses);
        setCurrentPartIndex(0);
        setTimeLeft(activePart.durationMinutes * 60); // 15 Mins
        setCurrentQIndex(0);
        setScreen('test');
        setTimerRunning(true);
      };

      // Select an Option
      const handleSelectOption = (optKey) => {
        if (answers[qNum] === optKey) {
          const nextAnswers = { ...answers };
          delete nextAnswers[qNum];
          setAnswers(nextAnswers);
          if (statuses[qNum] === 'answered') {
            setStatuses(prev => ({ ...prev, [qNum]: 'not_answered' }));
          } else if (statuses[qNum] === 'answered_marked_review') {
            setStatuses(prev => ({ ...prev, [qNum]: 'marked_review' }));
          }
        } else {
          setAnswers(prev => ({ ...prev, [qNum]: optKey }));
        }
      };

      // Clear Response
      const handleClearResponse = () => {
        const nextAnswers = { ...answers };
        delete nextAnswers[qNum];
        setAnswers(nextAnswers);

        if (statuses[qNum] === 'answered') {
          setStatuses(prev => ({ ...prev, [qNum]: 'not_answered' }));
        } else if (statuses[qNum] === 'answered_marked_review') {
          setStatuses(prev => ({ ...prev, [qNum]: 'marked_review' }));
        }
      };

      // Save & Next
      const handleSaveAndNext = () => {
        const hasAnswer = Boolean(answers[qNum]);
        setStatuses(prev => ({
          ...prev,
          [qNum]: hasAnswer ? 'answered' : 'not_answered'
        }));

        // Move to next question if within active part
        if (currentQIndex < activePart.endQ - 1) {
          const nextIndex = currentQIndex + 1;
          const nextQNum = questions[nextIndex].question_number;
          setStatuses(prev => ({
            ...prev,
            [nextQNum]: prev[nextQNum] === 'not_visited' || !prev[nextQNum] ? 'not_answered' : prev[nextQNum]

          setCurrentQIndex(nextIndex);
        } else {

            setActiveModal('submit_part_confirm');
          } else {
            setActiveModal('submit_confirm');
          }
        }

      // Mark for Review & Next

        const hasAnswer = Boolean(answers[qNum]);
        setStatuses(prev => ({
          ...prev,
          [qNum]: hasAnswer ? 'answered_marked_review' : 'marked_review'

        if (currentQIndex < activePart.endQ - 1) {
          const nextIndex = currentQIndex + 1;
          const nextQNum = questions[nextIndex].question_number;
          setStatuses(prev => ({
            ...prev,
            [nextQNum]: prev[nextQNum] === 'not_visited' || !prev[nextQNum] ? 'not_answered' : prev[nextQNum]

          setCurrentQIndex(nextIndex);

      const handleJumpToQuestion = (targetIndex) => {
        const targetQ = questions[targetIndex];

        // Ensure target is within active part
        if (targetQNum < activePart.startQ || targetQNum > activePart.endQ) {
          alert(`You can only view questions in active section: ${activePart.name} (${activePart.title}).`);
          return;
        }
        
        setStatuses(prev => {
          const currentStatus = prev[qNum];
          const updated = { ...prev };
          if (!currentStatus || currentStatus === 'not_visited') {
            updated[qNum] = answers[qNum] ? 'answered' : 'not_answered';
          }
          if (!updated[targetQNum] || updated[targetQNum] === 'not_visited') {
            updated[targetQNum] = 'not_answered';

          return updated;

                totalCorrect++;

                {/* Submit Part or Submit Test */}

                  <button

                      return (
                        <label
                          key={optKey}

                            isSelected

                          <input
                            type="radio"

                          />
                          <div className="text-sm sm:text-base text-gray-800 flex-1">
                            {renderMathText(optText)}

                        </label>
                      );
                    })}

                </div>

                {/* Bottom Action Bar */}
                <div className="pt-6 border-t border-gray-200 flex items-center justify-between mt-6">
                  <button

                  <button

                    Clear Response
                  </button>

                  {/* Save & Next or Submit Part if last question of part */}
                  {currentQIndex === activePart.endQ - 1 ? (
                    currentPartIndex < partsConfig.length - 1 ? (
                      <button
                        onClick={() => {
                          handleSaveAndNext();
                          setActiveModal('submit_part_confirm');
                        }}
                        className="px-6 py-2 bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs sm:text-sm rounded shadow transition flex items-center space-x-1"
                      >
                        <span>Save & Submit {activePart.name}</span>
                        <span>&rarr;</span>
                      </button>
                    ) : (
                      <button
                        onClick={() => {
                          handleSaveAndNext();
                          setActiveModal('submit_confirm');
                        }}
                        className="px-6 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs sm:text-sm rounded shadow transition"
                      >
                        Save & Final Submit
                      </button>
                    )
                  ) : (
                    <button
                      onClick={handleSaveAndNext}
                      className="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs sm:text-sm rounded shadow transition"

                      Save & Next

              </div>

              {/* RIGHT: QUESTION PALETTE SIDEBAR */}

                {/* 4 Parts Tabs (Multi-Part Progress) */}
                {isMultiPart && (
                  <div className="p-2 border-b border-gray-200 bg-gray-50 grid grid-cols-2 gap-1.5 text-[11px]">
                    {partsConfig.map((part, pIdx) => {
                      const isActive = pIdx === currentPartIndex;
                      const isPast = pIdx < currentPartIndex;
                      return (
                        <div
                          key={part.id}
                          className={`p-1.5 rounded border text-center font-bold transition flex flex-col justify-center ${
                            isActive
                              ? 'bg-blue-50 border-blue-500 text-blue-800 shadow-xs'
                              : isPast
                              ? 'bg-emerald-50 border-emerald-300 text-emerald-700 opacity-90'
                              : 'bg-gray-100 border-gray-200 text-gray-400'
                          }`}
                        >
                          <div className="flex items-center justify-center space-x-1">
                            <span>{part.name}</span>
                            {isPast && <span className="text-emerald-600">&#10003;</span>}
                            {isActive && <span className="w-1.5 h-1.5 rounded-full bg-blue-600 animate-pulse"></span>}
                            {!isPast && !isActive && <span>&#128274;</span>}
                          </div>
                          <span className="text-[9px] font-normal truncate">{part.title.split(' ')[0]}</span>
                        </div>
                      );
                    })}
                  </div>
                )}

                {/* Palette Header */}
                <div className="p-3 border-b border-gray-200 bg-gray-50 flex items-center justify-between">

                    {activePart.name}: {activePart.title}

                  <span className="text-[11px] text-gray-500 font-mono">
                    Q {activePart.startQ} - {activePart.endQ}
                  </span>
                </div>

                {/* 25 Questions Number Grid (5x5) */}
                <div className="p-3 overflow-y-auto flex-1">
                  <div className="grid grid-cols-5 gap-2">
                    {currentPartQuestions.map((q) => {
                      const number = q.question_number;
                      const idx = number - 1;
                      const status = statuses[number] || 'not_visited';
                      const isCurrent = idx === currentQIndex;
                      
                      let statusClass = "status-not-visited";
                      if (status === 'answered') statusClass = "status-answered";
                      else if (status === 'not_answered') statusClass = "status-not-answered";
                      else if (status === 'marked_review') statusClass = "status-marked-review";
                      else if (status === 'answered_marked_review') statusClass = "status-answered-marked";

                      return (
                        <button
                          key={number}
                          onClick={() => handleJumpToQuestion(idx)}
                          className={`palette-btn w-10 h-10 ${statusClass} ${
                            isCurrent ? 'ring-2 ring-cyan-500 ring-offset-1 scale-105' : ''
                          }`}
                        >
                          {number}
                          {status === 'answered_marked_review' && (
                            <span className="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-emerald-500 rounded-full border border-white flex items-center justify-center text-[7px]">
                              &#10003;
                            </span>
                          )}
                        </button>
                      );

            {activeModal === 'summary' && (

                    <div className="flex justify-between py-1 border-b text-purple-700">

                      <span className="font-bold">{overallCounts.markedReview}</span>

                      <span className="font-bold">{overallCounts.answeredMarked}</span>
                    </div>
                    <div className="flex justify-between py-1 text-gray-600">
                      <span>Not Visited:</span>
                      <span className="font-bold">{overallCounts.notVisited}</span>
                    </div>
                  </div>
                  <button onClick={() => setActiveModal(null)} className="w-full py-2 bg-blue-600 text-white rounded font-bold text-xs">Resume Test</button>
                </div>
              </div>
            )}

            {/* Modal: Confirm Submit Part & Proceed */}
            {activeModal === 'submit_part_confirm' && (
              <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                <div className="bg-white rounded-xl max-w-md w-full p-6 space-y-4 shadow-2xl border border-gray-200">
                  <div className="border-b pb-2">
                    <h3 className="font-black text-base text-gray-900">Submit {activePart.name} & Proceed</h3>
                    <p className="text-xs text-gray-500">
                      {activePart.title} (Questions {activePart.startQ} to {activePart.endQ})

                  <div className="bg-amber-50 p-3.5 rounded-lg border border-amber-200 text-xs text-amber-900 space-y-1.5">
                    <p className="font-bold">&#9888;&#65039; Warning:</p>
                    <p>
                      Once you submit <strong>{activePart.name}</strong>, you will proceed to{' '}
                      <strong>{partsConfig[currentPartIndex + 1]?.name} ({partsConfig[currentPartIndex + 1]?.title})</strong> with a fresh <strong>15-minute timer</strong>.

                    <p className="text-amber-800">You will NOT be able to return to {activePart.name} questions.</p>

                  <div className="bg-gray-50 p-3 rounded border text-xs space-y-1.5">
                    <div className="flex justify-between">
                      <span>Questions Answered in this Part:</span>
                      <span className="font-bold text-emerald-700">{partAnalysisCounts.answered + partAnalysisCounts.answeredMarked} / 25</span>
                    </div>
                    <div className="flex justify-between">
                      <span>Unanswered in this Part:</span>
                      <span className="font-bold text-rose-700">{partAnalysisCounts.notAnswered + partAnalysisCounts.notVisited} / 25</span>
                    </div>
                  </div>

                  <div className="flex items-center justify-end space-x-3 pt-2">
                    <button
                      onClick={() => setActiveModal(null)}

                      Return to Questions
                    </button>
                    <button
                      onClick={handleProceedToNextPart}
                      className="px-5 py-2 bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs rounded shadow"

                      Yes, Proceed to {partsConfig[currentPartIndex + 1]?.name} &rarr;
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Modal: Confirm Final Submit */}
            {activeModal === 'submit_confirm' && (
              <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                <div className="bg-white rounded-xl max-w-lg w-full p-6 space-y-5 shadow-2xl border border-gray-200">
                  <div className="border-b pb-2">
                    <h3 className="font-black text-lg text-gray-900">Submit Examination</h3>
                    <p className="text-xs text-gray-500">Are you sure you want to finish and submit your entire live test?</p>

                  <div className="bg-gray-50 p-4 rounded-lg border border-gray-200 text-xs space-y-2">
                    <div className="flex justify-between">
                      <span className="text-gray-600">Candidate Name:</span>
                      <span className="font-bold text-gray-900">{userProfile.name}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-gray-600">Total Questions:</span>
                      <span className="font-bold">{questions.length}</span>
                    </div>
                    <div className="flex justify-between text-emerald-700">
                      <span>Total Questions Answered:</span>
                      <span className="font-bold">{overallCounts.answered + overallCounts.answeredMarked}</span>
                    </div>
                    <div className="flex justify-between text-rose-700">
                      <span>Questions Not Answered:</span>
                      <span className="font-bold">{overallCounts.notAnswered + overallCounts.notVisited}</span>
                    </div>
                  </div>

                  <div className="flex items-center justify-end space-x-3 pt-2">
                    <button
                      onClick={() => setActiveModal(null)}
                      className="px-4 py-2 border border-gray-300 rounded font-semibold text-xs text-gray-700 hover:bg-gray-100"
                    >
                      No, Resume Test
                    </button>
                    <button
                      onClick={handleFinalSubmit}
                      disabled={isSubmitting}
                      className="px-6 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded shadow"
                    >
                      {isSubmitting ? "Submitting..." : "Yes, Submit Test"}
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      // =========================================================================
      // SCREEN 4: TEST RESULTS & SCORECARD WITH 4-PART BREAKDOWN
      // =========================================================================
      if (screen === 'result' && testResult) {
        return (
          <div className="min-h-screen bg-[#f8fafc] text-slate-800 flex flex-col justify-between">
            {/* TOP HEADER */}
            <header className="border-b border-gray-200 px-6 py-3 bg-white flex items-center justify-between shadow-xs">
              <div className="flex items-center space-x-3">
                <span className="text-2xl font-black tracking-tighter text-[#00A8B5] flex items-center">
                  NLP<span className="text-amber-500 font-extrabold text-xl ml-0.5">+</span>
                </span>
                <div className="h-4 w-px bg-gray-300"></div>
                <h1 className="text-sm sm:text-base font-bold text-gray-800">
                  Examination Scorecard & Performance Analysis
                </h1>
              </div>

              <div className="flex items-center space-x-3">
                <button
                  onClick={handleReattempt}
                  className="px-4 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-lg transition"
                >
                  &#8635; Re-attempt Test
                </button>
                <a
                  href="dashboard.html"
                  className="px-4 py-1.5 border border-gray-300 hover:bg-gray-100 text-gray-700 text-xs font-bold rounded-lg transition"
                >
                  Back to Dashboard
                </a>
              </div>
            </header>

            {/* MAIN SCORECARD */}
            <main className="max-w-6xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex-1 space-y-6">
              {/* Top Hero Banner */}
              <div className="bg-gradient-to-r from-slate-900 via-[#182030] to-slate-900 text-white p-6 sm:p-8 rounded-2xl shadow-xl flex flex-col md:flex-row items-center justify-between gap-6">
                <div className="space-y-2 text-center md:text-left">
                  <span className="bg-emerald-500/20 border border-emerald-400/30 text-emerald-300 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">
                    &#9679; Test Completed Successfully
                  </span>
                  <h2 className="text-2xl sm:text-3xl font-black tracking-tight">{testInfo.title}</h2>
                  <p className="text-xs sm:text-sm text-slate-300">
                    Aspirant: <strong>{testResult.userName}</strong> &bull; Sync to Supabase: <span className="text-emerald-400 font-bold">Active</span>
                  </p>
                </div>

                {/* Score Big Circle */}
                <div className="flex items-center space-x-6 shrink-0">
                  <div className="text-center p-4 bg-white/10 backdrop-blur rounded-2xl border border-white/10">
                    <div className="text-3xl sm:text-4xl font-black text-amber-400 font-mono">
                      {testResult.score} <span className="text-sm font-normal text-slate-300">/ {testResult.maximumMarks}</span>
                    </div>
                    <div className="text-[11px] uppercase font-bold text-slate-300 tracking-wider mt-1">Final Score</div>
                  </div>

                  <div className="text-center p-4 bg-white/10 backdrop-blur rounded-2xl border border-white/10">
                    <div className="text-3xl sm:text-4xl font-black text-emerald-400 font-mono">
                      {testResult.accuracy}%
                    </div>
                    <div className="text-[11px] uppercase font-bold text-slate-300 tracking-wider mt-1">Accuracy</div>
                  </div>
                </div>
              </div>

              {/* 4-Part Sectional Performance Breakdown Table */}
              {testResult.partsBreakdown && testResult.partsBreakdown.length > 1 && (
                <div className="bg-white rounded-2xl border border-gray-200 overflow-hidden shadow-xs">
                  <div className="bg-gray-100 px-5 py-3 border-b font-bold text-xs text-gray-800 uppercase tracking-wide flex items-center justify-between">
                    <span>Sectional Performance Breakdown (15 Mins / 25 Qs Per Part)</span>
                    <span className="text-gray-500 font-normal lowercase text-[11px]">4 parts &bull; 100 questions total</span>
                  </div>
                  <div className="overflow-x-auto">
                    <table className="w-full text-xs text-left">
                      <thead className="bg-gray-50 border-b text-gray-600">
                        <tr>
                          <th className="py-3 px-5">Section / Part</th>
                          <th className="py-3 px-3 text-center">Total Qs</th>
                          <th className="py-3 px-3 text-center">Attempted</th>
                          <th className="py-3 px-3 text-center text-emerald-700">Correct (+2)</th>
                          <th className="py-3 px-3 text-center text-rose-700">Wrong (-0.5)</th>
                          <th className="py-3 px-3 text-center">Accuracy</th>
                          <th className="py-3 px-5 text-right">Score (Max 50)</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-gray-100 font-medium">
                        {testResult.partsBreakdown.map((part) => (
                          <tr key={part.id} className="hover:bg-gray-50/80 transition">
                            <td className="py-3 px-5 font-bold text-gray-900">
                              <span className="bg-blue-100 text-blue-800 text-[10px] px-1.5 py-0.5 rounded font-mono mr-2">
                                {part.name}
                              </span>
                              {part.title}
                            </td>
                            <td className="py-3 px-3 text-center font-semibold text-gray-600">{part.total}</td>
                            <td className="py-3 px-3 text-center font-bold text-gray-800">{part.attempted}</td>
                            <td className="py-3 px-3 text-center font-bold text-emerald-600">+{part.correct}</td>
                            <td className="py-3 px-3 text-center font-bold text-rose-600">-{part.incorrect}</td>
                            <td className="py-3 px-3 text-center font-bold text-blue-700">{part.accuracy}%</td>
                            <td className="py-3 px-5 text-right font-black text-sm text-gray-900">{part.score} / 50</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* Metric Cards Grid */}
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                <div className="p-4 bg-white rounded-xl border border-gray-200 shadow-xs">
                  <div className="text-xs font-semibold text-gray-500">Attempted</div>
                  <div className="text-2xl font-bold text-gray-900 mt-1 font-mono">
                    {testResult.attempted} <span className="text-xs text-gray-400 font-normal">/ {testResult.totalQuestions}</span>
                  </div>
                </div>
                <div className="p-4 bg-white rounded-xl border border-gray-200 shadow-xs">
                  <div className="text-xs font-semibold text-emerald-600">Correct Answers</div>
                  <div className="text-2xl font-bold text-emerald-600 mt-1 font-mono">{testResult.correct}</div>
                </div>
                <div className="p-4 bg-white rounded-xl border border-gray-200 shadow-xs">
                  <div className="text-xs font-semibold text-rose-600">Incorrect Answers</div>
                  <div className="text-2xl font-bold text-rose-600 mt-1 font-mono">{testResult.incorrect}</div>
                </div>
                <div className="p-4 bg-white rounded-xl border border-gray-200 shadow-xs">
                  <div className="text-xs font-semibold text-gray-500">Unattempted</div>
                  <div className="text-2xl font-bold text-gray-600 mt-1 font-mono">{testResult.unattempted}</div>
                </div>
              </div>

              {/* Question Solutions Review Section */}
              <div className="bg-white rounded-2xl border border-gray-200 p-6 shadow-xs space-y-6">
                <div className="border-b pb-3 flex items-center justify-between">
                  <h3 className="text-lg font-bold text-gray-900">
                    Question Solutions & Step-by-Step Explanations
                  </h3>
                  <span className="text-xs text-gray-500">Bilingual Detailed Analysis</span>
                </div>

                <div className="space-y-6 divide-y divide-gray-100">
                  {questions.map((q) => {
                    const chosen = answers[q.question_number];
                    const isCorrect = chosen && chosen.toLowerCase() === q.correct_option.toLowerCase();
                    const isUnattempted = !chosen;

                    return (
                      <div key={q.question_number} className="pt-5 space-y-3">
                        <div className="flex items-start justify-between">
                          <div className="flex items-center space-x-2">
                            <span className="bg-gray-100 text-gray-700 text-xs font-bold px-2 py-0.5 rounded font-mono">
                              Q{q.question_number}
                            </span>
                            <span className="text-[11px] text-gray-500 font-semibold uppercase">
                              {q.section_name} &bull; {q.section_title}
                            </span>
                          </div>

                          <div>
                            {isCorrect ? (
                              <span className="bg-emerald-100 text-emerald-800 text-xs font-bold px-2.5 py-0.5 rounded-full">
                                &#10003; Correct (+{testInfo.marksPerQuestion})
                              </span>
                            ) : isUnattempted ? (
                              <span className="bg-gray-100 text-gray-600 text-xs font-bold px-2.5 py-0.5 rounded-full">
                                &mdash; Not Attempted (0)
                              </span>
                            ) : (
                              <span className="bg-rose-100 text-rose-800 text-xs font-bold px-2.5 py-0.5 rounded-full">
                                &times; Incorrect (-{testInfo.negativeMarks})
                              </span>
                            )}
                          </div>
                        </div>

                        {/* Statement (English & Hindi) */}
                        <div className="text-sm font-semibold text-gray-900 space-y-1">
                          <div>{renderMathText(q.question_text)}</div>
                          {q.question_text_hi && (
                            <div className="text-xs text-gray-600 font-normal pt-1 border-t border-gray-100">
                              {renderMathText(q.question_text_hi)}
                            </div>
                          )}
                        </div>

                        {/* Options Comparison */}
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs pt-1">
                          {['a', 'b', 'c', 'd'].map(opt => {
                            const isCorrectOpt = q.correct_option.toLowerCase() === opt;
                            const isUserChosen = chosen && chosen.toLowerCase() === opt;
                            return (
                              <div
                                key={opt}
                                className={`p-2.5 rounded-lg border flex items-center justify-between ${
                                  isCorrectOpt
                                    ? 'bg-emerald-50 border-emerald-300 text-emerald-900 font-bold'
                                    : isUserChosen
                                    ? 'bg-rose-50 border-rose-300 text-rose-900'
                                    : 'bg-gray-50/50 border-gray-200 text-gray-700'
                                }`}
                              >
                                <span>
                                  ({opt.toUpperCase()}) {renderMathText(q.options[opt])}
                                </span>
                                {isCorrectOpt && <span className="text-emerald-600 font-bold">&#10003; Correct Answer</span>}
                                {isUserChosen && !isCorrectOpt && <span className="text-rose-600 font-bold">Your Choice</span>}
                              </div>
                            );
                          })}
                        </div>

                        {/* Solution Explanation Box */}
                        {(q.solution_text || q.solution_text_hi) && (
                          <div className="p-3 bg-amber-50/70 border border-amber-200/80 rounded-xl text-xs space-y-1.5 text-amber-950">
                            <div className="font-bold text-amber-900 flex items-center space-x-1">
                              <span>&#128161;</span>
                              <span>Step-by-Step Solution:</span>
                            </div>
                            {q.solution_text && <div>{renderMathText(q.solution_text)}</div>}
                            {q.solution_text_hi && (
                              <div className="text-amber-900/90 pt-1 border-t border-amber-200/60 font-normal">
                                {renderMathText(q.solution_text_hi)}
                              </div>
                            )}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            </main>
          </div>
        );
      }

      return null;
    }

    ReactDOM.render(<MockTestApp />, document.getElementById('root'));
  </script>
</body>
</html>
