    // Helper to render KaTeX math in text elements
    const renderMathText = (text) => {
      if (!text) return "";
      // Replace $$formula$$ or $formula$ with rendered span if katex is available
      if (!window.katex) return text;
      
      const parts = text.split(/(\$\$.*?\$\$|\$.*?\$)/gs);
      return parts.map((part, idx) => {
        if (part.startsWith("$$") && part.endsWith("$$")) {
          const math = part.slice(2, -2).trim();
          try {
            const html = window.katex.renderToString(math, { displayMode: true, throwOnError: false });
            return <span key={idx} dangerouslySetInnerHTML={{ __html: html }} className="my-2 block text-center" />;
          } catch (e) {
            return part;
          }
        } else if (part.startsWith("$") && part.endsWith("$")) {
          const math = part.slice(1, -1).trim();
          try {
            const html = window.katex.renderToString(math, { displayMode: false, throwOnError: false });
            return <span key={idx} dangerouslySetInnerHTML={{ __html: html }} className="inline-block mx-1" />;
          } catch (e) {
            return part;
          }
        }
        return part;
      });
    };

    function MockTestApp() {
      // Screens: 'instructions_1' | 'instructions_2' | 'test' | 'result'
      const [screen, setScreen] = useState('instructions_1');
      const [userProfile, setUserProfile] = useState({ name: 'Nitin', role: 'Quant Specialist' });
      
      // Test metadata & questions
      const [testInfo, setTestInfo] = useState(DEFAULT_LIVE_TEST);
      const [questions, setQuestions] = useState(BUILTIN_QUESTIONS);
      const [loadingQuestions, setLoadingQuestions] = useState(false);
      
      // Exam State
      const [currentQIndex, setCurrentQIndex] = useState(0);
      const [answers, setAnswers] = useState({}); // { [qNum]: 'a' | 'b' | 'c' | 'd' }
      const [statuses, setStatuses] = useState({}); // { [qNum]: status }
      const [defaultLanguage, setDefaultLanguage] = useState('');
      const [agreedDeclaration, setAgreedDeclaration] = useState(false);
      const [questionLangs, setQuestionLangs] = useState({}); // { [qNum]: 'english' | 'hindi' }
      
      // Timer (15 mins = 900 seconds)
      const [timeLeft, setTimeLeft] = useState(DEFAULT_LIVE_TEST.durationMinutes * 60);
      const [timerRunning, setTimerRunning] = useState(false);
      
      // UI Settings
      const [isPaletteCollapsed, setIsPaletteCollapsed] = useState(false);
      const [zoomLevel, setZoomLevel] = useState(1.0);
      const [activeModal, setActiveModal] = useState(null); // 'symbols' | 'instructions' | 'summary' | 'report' | 'submit_confirm'
      
      // Test Result
      const [testResult, setTestResult] = useState(null);
      const [isSubmitting, setIsSubmitting] = useState(false);

      // Load active user from localStorage
      useEffect(() => {
        const storedUser = localStorage.getItem("ssc_active_user") || "Nitin";
        setUserProfile({
          name: storedUser,
          role: storedUser === "Om" ? "Speed Master" : (storedUser === "$H" ? "Exam Ranker" : "Quant Specialist")
        });
      }, []);

      // Fetch dynamic questions from Supabase if available
      useEffect(() => {
        async function fetchSupabaseQuestions() {
          if (!supabase) return;
          try {
            setLoadingQuestions(true);
            const { data, error } = await supabase
              .from('mock_test_questions')
              .select('*')
              .eq('test_id', DEFAULT_LIVE_TEST.id)
              .order('question_number', { ascending: true });

            if (!error && data && data.length > 0) {
              const formatted = data.map(q => ({
                question_number: q.question_number,
                section_name: q.section_name || "PART-A",
                section_title: q.section_title || "Quantitative Aptitude",
                question_text: q.question_text,
                question_text_hi: q.question_text_hi || q.question_text,
                options: {
                  a: q.option_a,
                  b: q.option_b,
                  c: q.option_c,
                  d: q.option_d
                },
                options_hi: {
                  a: q.option_a_hi || q.option_a,
                  b: q.option_b_hi || q.option_b,
                  c: q.option_c_hi || q.option_c,
                  d: q.option_d_hi || q.option_d
                },
                correct_option: q.correct_option ? q.correct_option.toLowerCase() : 'a',
                solution_text: q.solution_text || "",
                solution_text_hi: q.solution_text_hi || q.solution_text || ""
              }));
              setQuestions(formatted);
              console.log("Loaded questions from Supabase:", formatted.length);
            }
          } catch (err) {
            console.warn("Supabase questions fetch note (using built-in questions):", err.message);
          } finally {
            setLoadingQuestions(false);
          }
        }
        fetchSupabaseQuestions();
      }, []);

      // Countdown Timer
      useEffect(() => {
        let interval = null;
        if (timerRunning && screen === 'test' && timeLeft > 0) {
          interval = setInterval(() => {
            setTimeLeft(prev => {
              if (prev <= 1) {
                clearInterval(interval);
                handleFinalSubmit(); // Auto-submit when time expires
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(interval);
      }, [timerRunning, screen, timeLeft]);

      // Format time as MM : SS
      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${m < 10 ? '0' + m : m} : ${s < 10 ? '0' + s : s}`;
      };

      // Current Question
      const currentQ = questions[currentQIndex] || questions[0];
      const qNum = currentQ.question_number;
      const currentLang = questionLangs[qNum] || defaultLanguage || 'hindi';

      // Counts for Analysis Table
      const analysisCounts = useMemo(() => {
        let answered = 0;
        let notAnswered = 0;
        let markedReview = 0;
        let notVisited = 0;
        let answeredMarked = 0;

        questions.forEach(q => {
          const st = statuses[q.question_number];
          if (st === 'answered') answered++;
          else if (st === 'not_answered') notAnswered++;
          else if (st === 'marked_review') markedReview++;
          else if (st === 'answered_marked_review') answeredMarked++;
          else notVisited++;
        });

        return { answered, notAnswered, markedReview, notVisited, answeredMarked };
      }, [statuses, questions]);

      // Start Exam from Screen 2
      const handleStartTest = () => {
        if (!defaultLanguage) {
          alert("Please choose your default language before beginning the test.");
          return;
        }
        if (!agreedDeclaration) {
          alert("Please acknowledge the declaration checkbox.");
          return;
        }

        // Initialize question statuses: Question 1 is 'not_answered' (visited), others 'not_visited'
        const initialStatuses = {};
        questions.forEach((q, idx) => {
          initialStatuses[q.question_number] = idx === 0 ? 'not_answered' : 'not_visited';
        });
        setStatuses(initialStatuses);
        setScreen('test');
        setTimerRunning(true);
      };

      // Select an Option
      const handleSelectOption = (optKey) => {
        // Toggle selection if already selected
        if (answers[qNum] === optKey) {
          const nextAnswers = { ...answers };
          delete nextAnswers[qNum];
          setAnswers(nextAnswers);
          // If status was answered, revert to not_answered
          if (statuses[qNum] === 'answered') {
            setStatuses(prev => ({ ...prev, [qNum]: 'not_answered' }));
          } else if (statuses[qNum] === 'answered_marked_review') {
            setStatuses(prev => ({ ...prev, [qNum]: 'marked_review' }));
          }
        } else {
          setAnswers(prev => ({ ...prev, [qNum]: optKey }));
        }
      };

      // Clear Response
      const handleClearResponse = () => {
        const nextAnswers = { ...answers };
        delete nextAnswers[qNum];
        setAnswers(nextAnswers);

        if (statuses[qNum] === 'answered') {
          setStatuses(prev => ({ ...prev, [qNum]: 'not_answered' }));
        } else if (statuses[qNum] === 'answered_marked_review') {
          setStatuses(prev => ({ ...prev, [qNum]: 'marked_review' }));
        }
      };

      // Save & Next
      const handleSaveAndNext = () => {
        const hasAnswer = Boolean(answers[qNum]);
        setStatuses(prev => ({
          ...prev,
          [qNum]: hasAnswer ? 'answered' : 'not_answered'
        }));

        if (currentQIndex < questions.length - 1) {
          const nextIndex = currentQIndex + 1;
          const nextQNum = questions[nextIndex].question_number;
          // Mark next question as not_answered if it was not_visited
          setStatuses(prev => ({
            ...prev,
            [nextQNum]: prev[nextQNum] === 'not_visited' || !prev[nextQNum] ? 'not_answered' : prev[nextQNum]
          }));
          setCurrentQIndex(nextIndex);
        }
      };

      // Mark for Review & Next
      const handleMarkForReviewAndNext = () => {
        const hasAnswer = Boolean(answers[qNum]);
        setStatuses(prev => ({
          ...prev,
          [qNum]: hasAnswer ? 'answered_marked_review' : 'marked_review'
        }));

        if (currentQIndex < questions.length - 1) {
          const nextIndex = currentQIndex + 1;
          const nextQNum = questions[nextIndex].question_number;
          setStatuses(prev => ({
            ...prev,
            [nextQNum]: prev[nextQNum] === 'not_visited' || !prev[nextQNum] ? 'not_answered' : prev[nextQNum]
          }));
          setCurrentQIndex(nextIndex);
        }
      };

      // Jump to a Question from Palette
      const handleJumpToQuestion = (targetIndex) => {
        const targetQNum = questions[targetIndex].question_number;
        
        // If current question was unvisited and not answered, mark current as not_answered
        setStatuses(prev => {
          const currentStatus = prev[qNum];
          const updated = { ...prev };
          if (!currentStatus || currentStatus === 'not_visited') {
            updated[qNum] = answers[qNum] ? 'answered' : 'not_answered';
          }
          // Also mark target as not_answered if not visited
          if (!updated[targetQNum] || updated[targetQNum] === 'not_visited') {
            updated[targetQNum] = 'not_answered';
          }
          return updated;
        });

        setCurrentQIndex(targetIndex);
      };

      // Zoom In / Out
      const handleZoom = (delta) => {
        setZoomLevel(prev => {
          const next = Math.round((prev + delta) * 10) / 10;
          if (next >= 0.8 && next <= 1.4) return next;
          return prev;
        });
      };

      // Toggle Fullscreen
      const handleToggleFullscreen = () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(err => console.log(err));
        } else {
          document.exitFullscreen().catch(err => console.log(err));
        }
      };

      // Final Submit Test
      const handleFinalSubmit = async () => {
        setActiveModal(null);
        setTimerRunning(false);
        setIsSubmitting(true);

        // Calculate score
        let correct = 0;
        let incorrect = 0;
        let attempted = 0;

        questions.forEach(q => {
          const chosen = answers[q.question_number];
          if (chosen) {
            attempted++;
            if (chosen.toLowerCase() === q.correct_option.toLowerCase()) {
              correct++;
            } else {
              incorrect++;
            }
          }
        });

        const score = (correct * testInfo.marksPerQuestion) - (incorrect * testInfo.negativeMarks);
        const timeTaken = (testInfo.durationMinutes * 60) - timeLeft;

        const resultData = {
          userName: userProfile.name,
          testId: testInfo.id,
          totalQuestions: questions.length,
          attempted,
          correct,
          incorrect,
          unattempted: questions.length - attempted,
          score: Math.max(0, Math.round(score * 100) / 100),
          maximumMarks: testInfo.maximumMarks,
          accuracy: attempted > 0 ? Math.round((correct / attempted) * 100) : 0,
          timeTakenSeconds: timeTaken,
          submittedAt: new Date().toISOString()
        };

        setTestResult(resultData);

        // Save attempt to Supabase
        if (supabase) {
          try {
            await supabase.from('mock_test_submissions').insert({
              test_id: testInfo.id,
              user_name: userProfile.name,
              total_questions: questions.length,
              attempted_count: attempted,
              correct_count: correct,
              incorrect_count: incorrect,
              score: resultData.score,
              maximum_marks: testInfo.maximumMarks,
              time_taken_seconds: timeTaken,
              responses_json: answers
            });
            console.log("Saved test submission to Supabase successfully.");
          } catch (err) {
            console.warn("Could not save submission to Supabase:", err.message);
          }
        }

        setIsSubmitting(false);
        setScreen('result');
      };

      // Reset / Re-attempt
      const handleReattempt = () => {
        setAnswers({});
        setStatuses({});
        setTimeLeft(testInfo.durationMinutes * 60);
        setCurrentQIndex(0);
        setTestResult(null);
        setScreen('instructions_1');
      };

      // Render Active Language Option Text
      const getOptionText = (optKey) => {
        if (currentLang === 'hindi' && currentQ.options_hi && currentQ.options_hi[optKey]) {
          return currentQ.options_hi[optKey];
        }
        return currentQ.options[optKey] || "";
      };

      // =========================================================================
      // SCREEN 1: GENERAL INSTRUCTIONS (Matching Screenshot 1)
      // =========================================================================
      if (screen === 'instructions_1') {
        return (
          <div className="min-h-screen bg-white text-slate-800 flex flex-col justify-between">
            {/* TOP HEADER */}
            <header className="border-b border-gray-200 px-4 sm:px-6 py-2.5 flex items-center justify-between bg-white">
              <div className="flex items-center space-x-3">
                <div className="flex items-center">
                  <span className="text-2xl font-black tracking-tighter text-[#00A8B5] flex items-center">
                    NLP<span className="text-amber-500 font-extrabold text-xl ml-0.5">+</span>
                  </span>
                </div>
                <div className="h-4 w-px bg-gray-300"></div>
                <h1 className="text-sm sm:text-base font-semibold text-gray-700">
                  {testInfo.title}

            {activeModal === 'symbols' && (
              <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                <div className="bg-white rounded-lg max-w-md w-full p-5 space-y-4 shadow-xl">
                  <div className="flex items-center justify-between border-b pb-2">
                    <h3 className="font-bold text-base text-gray-900">Palette Symbols Legend</h3>
                    <button onClick={() => setActiveModal(null)} className="text-gray-500 font-bold hover:text-black">✕</button>
                  </div>
                  <div className="space-y-3 text-xs">
                    <div className="flex items-center space-x-3">
                      <span className="w-8 h-8 status-not-visited flex items-center justify-center font-bold">1</span>
                      <span>You have not visited the question yet.</span>
                    </div>
                    <div className="flex items-center space-x-3">
                      <span className="w-8 h-8 status-not-answered flex items-center justify-center font-bold">2</span>
                      <span>You have not answered the question.</span>
                    </div>
                    <div className="flex items-center space-x-3">
                      <span className="w-8 h-8 status-answered flex items-center justify-center font-bold">3</span>
                      <span>You have answered the question.</span>
                    </div>
                    <div className="flex items-center space-x-3">
                      <span className="w-8 h-8 status-marked-review flex items-center justify-center font-bold">4</span>
                      <span>You have NOT answered the question, but marked for review.</span>
                    </div>
                    <div className="flex items-center space-x-3">
                      <span className="w-8 h-8 status-answered-marked flex items-center justify-center font-bold relative">
                        5
                        <span className="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-emerald-500 rounded-full border border-white flex items-center justify-center text-[7px]">✓</span>
                      </span>
                      <span>You have answered the question, but marked it for review.</span>
                    </div>
                  </div>
                  <button onClick={() => setActiveModal(null)} className="w-full py-2 bg-blue-600 text-white rounded font-bold text-xs">Close</button>
                </div>
              </div>
            )}

            {/* Modal: Overall Test Summary */}
            {activeModal === 'summary' && (
              <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                <div className="bg-white rounded-lg max-w-md w-full p-5 space-y-4 shadow-xl">
                  <div className="flex items-center justify-between border-b pb-2">
                    <h3 className="font-bold text-base text-gray-900">Overall Test Summary</h3>
                    <button onClick={() => setActiveModal(null)} className="text-gray-500 font-bold hover:text-black">✕</button>
                  </div>
                  <div className="space-y-2 text-sm">
                    <div className="flex justify-between py-1 border-b">
                      <span>Total Questions:</span>
                      <span className="font-bold">{questions.length}</span>
                    </div>
                    <div className="flex justify-between py-1 border-b text-emerald-700">
                      <span>Answered:</span>
                      <span className="font-bold">{analysisCounts.answered}</span>
                    </div>
                    <div className="flex justify-between py-1 border-b text-rose-700">
                      <span>Not Answered:</span>
                      <span className="font-bold">{analysisCounts.notAnswered}</span>
                    </div>
                    <div className="flex justify-between py-1 border-b text-purple-700">
                      <span>Marked for Review:</span>
                      <span className="font-bold">{analysisCounts.markedReview}</span>
                    </div>
                    <div className="flex justify-between py-1 border-b text-purple-900">
                      <span>Answered & Marked for Review:</span>
                      <span className="font-bold">{analysisCounts.answeredMarked}</span>
                    </div>
                    <div className="flex justify-between py-1 text-gray-600">
                      <span>Not Visited:</span>
                      <span className="font-bold">{analysisCounts.notVisited}</span>
                    </div>
                  </div>
                  <button onClick={() => setActiveModal(null)} className="w-full py-2 bg-blue-600 text-white rounded font-bold text-xs">Resume Test</button>
                </div>
              </div>
            )}

            {/* Modal: Confirm Submit */}
            {activeModal === 'submit_confirm' && (
              <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                <div className="bg-white rounded-xl max-w-lg w-full p-6 space-y-5 shadow-2xl border border-gray-200">
                  <div className="border-b pb-2">
                    <h3 className="font-black text-lg text-gray-900">Submit Examination</h3>
                    <p className="text-xs text-gray-500">Are you sure you want to finish and submit your live test?</p>
                  </div>

                  <div className="bg-gray-50 p-4 rounded-lg border border-gray-200 text-xs space-y-2">
                    <div className="flex justify-between">
                      <span className="text-gray-600">Candidate Name:</span>
                      <span className="font-bold text-gray-900">{userProfile.name}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-gray-600">Total Questions:</span>
                      <span className="font-bold">{questions.length}</span>
                    </div>
                    <div className="flex justify-between text-emerald-700">
                      <span>Questions Answered:</span>
                      <span className="font-bold">{analysisCounts.answered + analysisCounts.answeredMarked}</span>
                    </div>
                    <div className="flex justify-between text-rose-700">
                      <span>Questions Not Answered:</span>
                      <span className="font-bold">{analysisCounts.notAnswered + analysisCounts.notVisited}</span>
                    </div>
                    <div className="flex justify-between text-purple-700">
                      <span>Marked for Review:</span>
                      <span className="font-bold">{analysisCounts.markedReview + analysisCounts.answeredMarked}</span>
                    </div>
                  </div>

                  <div className="flex items-center justify-end space-x-3 pt-2">
                    <button
                      onClick={() => setActiveModal(null)}
                      className="px-4 py-2 border border-gray-300 rounded font-semibold text-xs text-gray-700 hover:bg-gray-100"
                    >
                      No, Resume Test
                    </button>
                    <button
                      onClick={handleFinalSubmit}
                      disabled={isSubmitting}
                      className="px-6 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded shadow"
                    >
                      {isSubmitting ? "Submitting..." : "Yes, Submit Test"}
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      // =========================================================================
      // SCREEN 4: TEST RESULTS & SCORECARD REVIEW
      // =========================================================================
      if (screen === 'result' && testResult) {
        return (
          <div className="min-h-screen bg-gray-50 text-slate-800 flex flex-col justify-between">
            {/* Header */}
            <header className="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <span className="text-2xl font-black tracking-tighter text-[#00A8B5]">
                  NLP<span className="text-amber-500 font-extrabold text-xl ml-0.5">+</span>
                </span>
                <span className="text-sm font-semibold text-gray-700">Official Exam Scorecard</span>
              </div>
              <div className="flex items-center space-x-3">
                <a
                  href="dashboard.html"
                  className="px-4 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold text-xs rounded border"
                >
                  Return to Dashboard
                </a>
                <button
                  onClick={handleReattempt}
                  className="px-4 py-1.5 bg-cyan-600 hover:bg-cyan-700 text-white font-bold text-xs rounded"
                >
                  Re-attempt Test
                </button>
              </div>
            </header>

            {/* Scorecard Content */}
            <main className="max-w-6xl mx-auto w-full p-4 sm:p-6 lg:p-8 flex-1 space-y-8">
              {/* Scorecard Hero Card */}
              <div className="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm grid grid-cols-1 md:grid-cols-4 gap-6 text-center">
                <div className="border-r border-gray-100 p-2">
                  <span className="text-xs uppercase font-bold text-gray-500 tracking-wider">Candidate</span>
                  <div className="text-2xl font-black text-gray-900 mt-1">{testResult.userName}</div>
                  <span className="text-xs text-gray-500">{userProfile.role}</span>
                </div>
                <div className="border-r border-gray-100 p-2">
                  <span className="text-xs uppercase font-bold text-gray-500 tracking-wider">Total Score</span>
                  <div className="text-3xl font-black text-blue-600 mt-1">
                    {testResult.score} <span className="text-sm text-gray-500">/ {testResult.maximumMarks}</span>
                  </div>
                  <span className="text-xs text-emerald-600 font-bold">Accuracy: {testResult.accuracy}%</span>
                </div>
                <div className="border-r border-gray-100 p-2">
                  <span className="text-xs uppercase font-bold text-gray-500 tracking-wider">Attempt Breakdown</span>
                  <div className="flex items-center justify-center space-x-3 mt-2 text-xs font-bold">
                    <span className="text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded">✓ {testResult.correct} Correct</span>
                    <span className="text-rose-700 bg-rose-50 px-2 py-0.5 rounded">✗ {testResult.incorrect} Wrong</span>
                  </div>
                  <span className="text-[11px] text-gray-500 mt-1 block">{testResult.unattempted} Unattempted</span>
                </div>
                <div className="p-2">
                  <span className="text-xs uppercase font-bold text-gray-500 tracking-wider">Time Taken</span>
                  <div className="text-2xl font-black text-gray-800 mt-1">{formatTime(testResult.timeTakenSeconds)}</div>
                  <span className="text-xs text-emerald-600 font-medium">Live Synced to Supabase</span>
                </div>
              </div>

              {/* Question-by-Question Solution Review */}
              <div className="space-y-4">
                <h2 className="text-xl font-black text-gray-900 tracking-tight">Question-by-Question Solutions & Review</h2>
                
                <div className="space-y-4">
                  {questions.map((q) => {
                    const qn = q.question_number;
                    const chosen = answers[qn] || null;
                    const isCorrect = chosen && chosen.toLowerCase() === q.correct_option.toLowerCase();
                    const isUnattempted = !chosen;

                    return (
                      <div key={qn} className="bg-white p-5 rounded-xl border border-gray-200 shadow-xs space-y-3">
                        <div className="flex items-center justify-between border-b border-gray-100 pb-2">
                          <span className="font-bold text-sm text-gray-800">Question {qn}</span>
                          <span className={`text-xs font-bold px-2 py-0.5 rounded ${
                            isCorrect ? 'bg-emerald-100 text-emerald-800' : (isUnattempted ? 'bg-gray-100 text-gray-600' : 'bg-rose-100 text-rose-800')
                          }`}>
                            {isCorrect ? '✓ Correct (+2.0)' : (isUnattempted ? '○ Unattempted (0.0)' : '✗ Incorrect (-0.5)')}
                          </span>
                        </div>

                        {/* Statement */}
                        <div className="text-sm font-medium text-gray-900">
                          {renderMathText(q.question_text_hi || q.question_text)}
                        </div>

                        {/* Options Comparison */}
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                          {['a', 'b', 'c', 'd'].map(optKey => {
                            const isOptChosen = chosen === optKey;
                            const isOptCorrect = q.correct_option.toLowerCase() === optKey;
                            return (
                              <div
                                key={optKey}
                                className={`p-2 rounded border flex items-center justify-between ${
                                  isOptCorrect
                                    ? 'bg-emerald-50 border-emerald-300 font-bold text-emerald-900'
                                    : (isOptChosen ? 'bg-rose-50 border-rose-300 font-bold text-rose-900' : 'bg-gray-50 border-gray-200 text-gray-700')
                                }`}
                              >
                                <span>({optKey.toUpperCase()}) {q.options_hi ? q.options_hi[optKey] : q.options[optKey]}</span>
                                {isOptCorrect && <span className="text-emerald-700 font-bold">✓ Correct Option</span>}
                                {isOptChosen && !isOptCorrect && <span className="text-rose-700 font-bold">Your Choice</span>}
                              </div>
                            );
                          })}
                        </div>

                        {/* Solution */}
                        <div className="bg-blue-50/50 p-3 rounded border border-blue-100 text-xs text-slate-800 space-y-1">
                          <span className="font-bold text-blue-900 block">Explanation & Solution:</span>
                          <p>{q.solution_text_hi || q.solution_text}</p>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </main>
          </div>
        );
      }

      return null;
    }

    ReactDOM.render(<MockTestApp />, document.getElementById('root'));
  </script>
</body>
</html>
